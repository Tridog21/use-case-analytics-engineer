        tags: *id004
- name: dtr_cohort_outcomes
  description: '**Grain métier :** tenant_id × opportunity_key × followup_definition_key × anchor_at × horizon_days
    ; une opportunité de sa cohorte de création par horizon. **Identité logique :** `record_key=H(tenant_id, opportunity_key,
    followup_definition_key, anchor_key, horizon_days)`. **Grain historique/physique :** `(model_run_id,record_key)`
    ; version=H(run,key), une seule contribution par unité dans un run. Les clés métier et de dimensions sont conservées
    ci-dessous. Rafraîchissement manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id005
    - dtr
  columns:
  - name: model_run_id
    data_type: String
    description: Identifiant de la recomposition complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: SHA256 de la liste ordonnée des éléments du grain indiquée dans la fiche ; sérialisation canonique
      commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: SHA256 de (model_run_id, record_key).
  - name: row_hash
    data_type: String
    description: SHA256 du payload ordonné de la fiche, hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Instant de calcul du run ; aucune substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Version immuable des règles et référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Borne des entrées figées ; héritée du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Tenant Boond conservé dans les identités et jointures.
  - name: opportunity_key
    data_type: String
    description: Identité stable tenant + opportunité.
  - name: opportunity_id
    data_type: Int64
    description: Identifiant Boond du dossier, pour investigation.
  - name: company_key
    data_type: Nullable(String)
    description: Identité stable de société résolue au contexte retenu.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version de société pertinente au contexte retenu.
  - name: company_id
    data_type: Nullable(Int64)
    description: Identifiant Boond de la société.
  - name: company_name
    data_type: Nullable(String)
    description: dim_company.company_name par run+company_version_key, N:0..1.
  - name: followup_key
    data_type: String
    description: Identité logique de l'observation du fait.
  - name: followup_definition_key
    data_type: String
    description: Identité de définition de suivi explicitement retenue.
  - name: followup_definition_version_key
    data_type: Nullable(String)
    description: Version de la définition du même run.
  - name: created_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Création individuelle Boond, ancrage décidé ; les créations manquantes sont des anomalies de couverture
      hors cohorte calculable.
  - name: anchor_key
    data_type: String
    description: fct_opportunity_followup.anchor_key ; identité source de l'ancrage, distincte de son timestamp
      éventuellement inconnu.
  - name: anchor_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Création individuelle pour cette définition, sans changement de cohorte sur réentrée.
  - name: cohort_month
    data_type: Nullable(Date)
    description: Premier jour du mois civil de created_at en Europe/Paris.
  - name: horizon_days
    data_type: Nullable(UInt16)
    description: 30,60 ou90 selon les horizons demandés.
  - name: horizon_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Ajouter horizon_days jours calendaires à la création en Europe/Paris à même heure locale, puis
      conserver l'instant UTC.
  - name: cohort_mature_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: max(horizon_at) parmi tous membres connus tenant/mois/type commercial/définition/horizon, AVANT
      filtres équipe et canal.
  - name: issue_at_horizon
    data_type: Nullable(String)
    description: open/won/lost/abandoned/unqualified/unknown lorsque horizon évalué ; nurturing=open. NULL si horizon
      non atteint au run.
  - name: is_eligible
    data_type: Nullable(Bool)
    description: Admissibilité de l'unique ancrage dans la population de création ; ne pas exclure silencieusement
      un inconnu.
  - name: is_mature
    data_type: Nullable(Bool)
    description: horizon_at <= observation du run, conservé pour contrôle ; à recalculer si observation BI différente.
  - name: is_cohort_mature
    data_type: Nullable(Bool)
    description: cohort_mature_at <= observation du run ; à recalculer pour observation BI différente.
  - name: is_observable
    data_type: Nullable(Bool)
    description: L'histoire permet de déterminer le statut à horizon_at ; distinct de maturité.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Début observable de l'historique utile du dossier.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Fin observable connue.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Couverture déclarée ; la maturité ne prouve jamais l'exhaustivité des membres ni l'observabilité.
  - name: nb_cohort_membership
    data_type: UInt8
    description: 1 pour cette identité admissible de cohorte/horizon ; effectif de base connu, pas à sommer entre
      horizons.
  - name: denominator_contribution
    data_type: Nullable(UInt8)
    description: 1 pour le membre de base à horizon mature ; NULL pour non mature ou inadmissible non résolu. Les
      inconnus matures restent au dénominateur.
  - name: open_contribution
    data_type: Nullable(UInt8)
    description: 1 si issue=open à horizon mature, 0 si une autre issue mature, NULL si horizon non mature.
  - name: won_contribution
    data_type: Nullable(UInt8)
    description: Même convention pour won ; état 1 constitue victoire, état 14 ne crée pas une nouvelle ligne.
  - name: lost_contribution
    data_type: Nullable(UInt8)
    description: Même convention pour lost, distinct des abandons/nonqualifiés.
  - name: abandoned_contribution
    data_type: Nullable(UInt8)
    description: Même convention pour abandoned, conservé séparément.
  - name: unqualified_contribution
    data_type: Nullable(UInt8)
    description: Même convention pour unqualified, conservé séparément.
  - name: unknown_contribution
    data_type: Nullable(UInt8)
    description: 1 pour mature avec état/couverture non observable ou non classable ; NULL pour non mature. Maintient
      la base entière, sans classer l'inconnu comme perdu.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Type commercial du dossier dans le contexte retenu ; ne désigne pas la composante financière New/Upsell.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Identité stable du type commercial.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Version de dim_sale_type pertinente.
  - name: sale_type_label
    data_type: Nullable(String)
    description: dim_sale_type.sale_type_label par run+version, N:0..1.
  - name: channel_key
    data_type: Nullable(String)
    description: Alias explicite de acquisition_channel_key du fait ; canal officiel d'entrée, NULL avant règle
      validée.
  - name: channel_version_key
    data_type: Nullable(String)
    description: Version de mapping du canal, indépendante des sources candidates conservées.
  - name: channel_label
    data_type: Nullable(String)
    description: dim_channel.channel_label par run+version, N:0..1.
  - name: channel_candidate_code
    data_type: Nullable(String)
    description: Valeur candidate Boond conservée sans la transformer en canal officiel.
  - name: is_channel_calculable
    data_type: Bool
    description: false si origine à création ou mapping de valeur est manquant ; règle D24 définie, filtre disponible
      sur les lignes résolues.
  - name: employee_key
    data_type: Nullable(String)
    description: Identité stable du responsable retenu.
  - name: employee_version_key
    data_type: Nullable(String)
    description: Version descriptive du responsable.
  - name: employee_display_name
    data_type: Nullable(String)
    description: dim_employee.employee_display_name par run+version, N:0..1.
  - name: team_key
    data_type: Nullable(String)
    description: Équipe historiquement retenue si mapping et attribution validés.
  - name: team_version_key
    data_type: Nullable(String)
    description: Version de l'équipe pertinente.
  - name: team_name
    data_type: Nullable(String)
    description: dim_team.team_name par run+version, N:0..1.
  - name: is_team_calculable
    data_type: Bool
    description: false pour rattachement à entrée/événement inconnu ou ambigu ; sinon true y compris KAM connue,
      indépendamment de son absence de cible D23.
  - name: calculation_status
    data_type: String
    description: ready/partial/blocked/not_applicable ; ready n'efface pas les réserves distinctes de couverture.
  - name: status_reason
    data_type: Nullable(String)
    description: Motif explicite, stable et documenté ; plusieurs motifs séparés de façon canonique si nécessaire.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id005
