version: 2
models:
- name: dtr_sales_objectives_month
  description: '**Grain métier :** tenant_id × month_date × source_segment × metric_code ; segment Sales de la cible,
    équipe résolue seulement si mapping univoque. **Identité logique :** `record_key=H(tenant_id, month_date, source_segment,
    metric_code)`. **Grain historique/physique :** `(model_run_id,record_key)` ; version=H(run,key), une seule contribution
    par unité dans un run. Les clés métier et de dimensions sont conservées ci-dessous. Rafraîchissement manuel
    à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - dtr
  columns:
  - name: model_run_id
    data_type: String
    description: Identifiant de la recomposition complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: SHA256 de la liste ordonnée des éléments du grain indiquée dans la fiche ; sérialisation canonique
      commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: SHA256 de (model_run_id, record_key).
  - name: row_hash
    data_type: String
    description: SHA256 du payload ordonné de la fiche, hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Instant de calcul du run ; aucune substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Version immuable des règles et référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Borne des entrées figées ; héritée du manifeste de run.
  - name: tenant_id
    data_type: String
    description: 'Fait : tenant de la comparaison.'
  - name: month_date
    data_type: Date
    description: 'Fait : premier jour du mois de reporting Europe/Paris.'
  - name: source_segment
    data_type: String
    description: 'fct_sales_objectives_month.source_segment : SMB/LA/ES ; identité du segment de cible sans fabriquer
      une businessunit.'
  - name: team_key
    data_type: Nullable(String)
    description: fct_sales_objectives_month.team_key ; NULL si mapping source_segment→équipe non résolu. La clé
      du grain utilise source_segment pour préserver les cibles non rapprochées.
  - name: team_version_key
    data_type: Nullable(String)
    description: 'Fait : version pertinente de l''équipe ; NULL si mapping non résolu.'
  - name: team_name
    data_type: Nullable(String)
    description: dim_team.team_name, jointure par model_run_id + team_version_key.
  - name: metric_code
    data_type: String
    description: 'Fait : mrr_signed, pipeline_generated, pipeline_weighted ou demos.'
  - name: metric_key
    data_type: String
    description: 'Fait : identité de l''indicateur.'
  - name: metric_version_key
    data_type: String
    description: Version de dim_metric utilisée par le run.
  - name: metric_label
    data_type: Nullable(String)
    description: dim_metric.metric_label ; une ligne de dimension au plus.
  - name: value_unit
    data_type: String
    description: fct_sales_objectives_month.value_unit, déclaration attendue de mesure (peut marquer pipeline non
      confirmé) ; ne prouve pas la comparabilité du réalisé. Ce dernier reste NULL sans unité validée.
  - name: actual_value
    data_type: Nullable(Decimal(38,4))
    description: 'Fait : réalisé de la population compatible, jamais un candidat monétaire promu sans validation.'
  - name: target_value
    data_type: Nullable(Decimal(38,4))
    description: 'Fait : cible versionnée de la même équipe et du même mois.'
  - name: variance_value
    data_type: Nullable(Decimal(38,4))
    description: actual_value - target_value seulement si les deux valeurs et leur comparabilité sont connues.
  - name: attainment_rate
    data_type: Nullable(Float64)
    description: actual_value / target_value si cible > 0 et valeurs comparables ; affichage ×100 dans la BI.
  - name: is_population_compatible
    data_type: Nullable(Bool)
    description: Population4/7 décidée D22 ; compatibilité d’unité/date vérifiée séparément, NULL si preuve d’unité
      manque.
  - name: nb_source_contributions
    data_type: Nullable(UInt64)
    description: Nombre de contributions logiques examinées dans le réalisé, s'il est disponible dans le fait.
  - name: nb_uncalculable_contributions
    data_type: Nullable(UInt64)
    description: Nombre de contributions dont le calcul reste inconnu ; ne prouve pas à lui seul la complétude de
      la source.
  - name: calculation_status
    data_type: String
    description: ready/partial/blocked/not_applicable ; statut transmis et combiné aux contrôles de jointure.
  - name: status_reason
    data_type: Nullable(String)
    description: 'Motif explicite : unconfirmed_amount_unit, missing_team_mapping, missing_demo_completion_proof,
      incompatible_population, missing_target, zero_target, ou motif du fait.'
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id001
- name: dtr_funnel_progress
  description: '**Grain métier :** tenant_id × opportunity_key × définition de parcours × anchor_at × target_stage_id
    ; une contribution de dossier par étape cible. **Identité logique :** `record_key=H(tenant_id, opportunity_key,
    followup_definition_key, anchor_at, target_stage_id)`. **Grain historique/physique :** `(model_run_id,record_key)`
    ; version=H(run,key), une seule contribution par unité dans un run. Les clés métier et de dimensions sont conservées
    ci-dessous. Rafraîchissement manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id002
    - dtr
  columns:
  - name: model_run_id
    data_type: String
    description: Identifiant de la recomposition complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: SHA256 de la liste ordonnée des éléments du grain indiquée dans la fiche ; sérialisation canonique
      commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: SHA256 de (model_run_id, record_key).
  - name: row_hash
    data_type: String
    description: SHA256 du payload ordonné de la fiche, hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Instant de calcul du run ; aucune substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Version immuable des règles et référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Borne des entrées figées ; héritée du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Tenant Boond conservé dans les identités et jointures.
  - name: opportunity_key
    data_type: String
    description: Identité stable tenant + opportunité.
  - name: opportunity_id
    data_type: Int64
    description: Identifiant Boond du dossier, pour investigation.
  - name: company_key
    data_type: Nullable(String)
    description: Identité stable de société résolue au contexte retenu.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version de société pertinente au contexte retenu.
  - name: company_id
    data_type: Nullable(Int64)
    description: Identifiant Boond de la société.
  - name: company_name
    data_type: Nullable(String)
    description: dim_company.company_name par run+company_version_key, N:0..1.
  - name: followup_key
    data_type: String
    description: Identité de la contribution canonique de suivi.
  - name: followup_definition_key
    data_type: String
    description: Définition versionnée du parcours et de l'étape cible ; ne pas additionner des définitions différentes.
  - name: followup_definition_version_key
    data_type: String
    description: Version de dim_followup_definition utilisée.
  - name: created_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Création métier Boond, ancrage d'entrée du pipeline.
  - name: anchor_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Ancrage de définition D17/D18 ; NULL et qualité si date d’entrée non observable, pas règle indécise.
  - name: cohort_month
    data_type: Nullable(Date)
    description: Mois de création Paris, filtre cohorte du tunnel.
  - name: sale_path_code
    data_type: Nullable(String)
    description: dim_sale_type.sale_type_code associé au type d'ancrage ; aucune déduction du parcours depuis un
      code d'étape.
  - name: target_stage_id
    data_type: Int64
    description: Étape cible de la ligne.
  - name: target_stage_key
    data_type: Nullable(String)
    description: Identité stable de l'étape cible.
  - name: target_stage_version_key
    data_type: Nullable(String)
    description: Version de la cible.
  - name: target_stage_label
    data_type: Nullable(String)
    description: Libellé dim_stage de la cible par run+version.
  - name: funnel_position
    data_type: Nullable(UInt16)
    description: Position explicite dans le parcours validé ; jamais tri du code numérique.
  - name: previous_target_stage_id
    data_type: Nullable(Int64)
    description: Étape précédente définie du même parcours, NULL pour la première.
  - name: first_reached_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Première entrée admissible connue dans la cible après ancrage ; NULL n'est pas preuve d'échec.
  - name: first_reached_observed_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Première preuve d'observation en cible, utilisable comme borne supérieure d'atteinte sans inventer
      une entrée exacte.
  - name: previous_stage_first_reached_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Première atteinte admissible de l'étape précédente selon définition.
  - name: transition_reached_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Alias de first_reached_at du suivi stage_transition sélectionné, après ancrage source ; jointure
      explicitée, pas colonne supposée du fait.
  - name: is_eligible
    data_type: Nullable(Bool)
    description: Admissibilité du dossier à la population commune du parcours.
  - name: is_definition_enabled
    data_type: Bool
    description: dim_followup_definition.is_enabled ; false si définition absente/désactivée, avec blocked_definition
      dans disponibilité.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Borne de couverture historique de la population suivie.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Fin de couverture connue.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Couverture permettant de distinguer non atteinte observée et absence de trace.
  - name: reached_target
    data_type: Nullable(Bool)
    description: Résultat à l'observation du run ; recalculer par les timestamps pour une autre observation.
  - name: denominator_contribution
    data_type: Nullable(UInt8)
    description: Contribution du dossier admissible au dénominateur de la définition ; NULL si non calculable.
  - name: converted_contribution
    data_type: Nullable(UInt8)
    description: Contribution admissible convertie, interprétée avec son ancrage/horizon ; ne pas sommer sans restriction
      d'observation.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Type commercial du dossier dans le contexte retenu ; ne désigne pas la composante financière New/Upsell.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Identité stable du type commercial.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Version de dim_sale_type pertinente.
  - name: sale_type_label
    data_type: Nullable(String)
    description: dim_sale_type.sale_type_label par run+version, N:0..1.
  - name: channel_key
    data_type: Nullable(String)
    description: Alias explicite de acquisition_channel_key du fait ; canal officiel d'entrée, NULL avant règle
      validée.
  - name: channel_version_key
    data_type: Nullable(String)
    description: Version de mapping du canal, indépendante des sources candidates conservées.
  - name: channel_label
    data_type: Nullable(String)
    description: dim_channel.channel_label par run+version, N:0..1.
  - name: channel_candidate_code
    data_type: Nullable(String)
    description: Valeur candidate Boond conservée sans la transformer en canal officiel.
  - name: is_channel_calculable
    data_type: Bool
    description: false si origine à création ou mapping de valeur est manquant ; règle D24 définie, filtre disponible
      sur les lignes résolues.
  - name: employee_key
    data_type: Nullable(String)
    description: Identité stable du responsable retenu.
  - name: employee_version_key
    data_type: Nullable(String)
    description: Version descriptive du responsable.
  - name: employee_display_name
    data_type: Nullable(String)
    description: dim_employee.employee_display_name par run+version, N:0..1.
  - name: team_key
    data_type: Nullable(String)
    description: Équipe historiquement retenue si mapping et attribution validés.
  - name: team_version_key
    data_type: Nullable(String)
    description: Version de l'équipe pertinente.
  - name: team_name
    data_type: Nullable(String)
    description: dim_team.team_name par run+version, N:0..1.
  - name: is_team_calculable
    data_type: Bool
    description: false pour rattachement à entrée/événement inconnu ou ambigu ; sinon true y compris KAM connue,
      indépendamment de son absence de cible D23.
  - name: calculation_status
    data_type: String
    description: ready/partial/blocked/not_applicable ; ready n'efface pas les réserves distinctes de couverture.
  - name: status_reason
    data_type: Nullable(String)
    description: Motif explicite, stable et documenté ; plusieurs motifs séparés de façon canonique si nécessaire.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id002
- name: dtr_company_mrr_month
  description: '**Grain métier :** tenant_id × company_key × closing_date ; une ligne par société aux deux clôtures
    comparées. **Identité logique :** `record_key=H(tenant_id, company_key, closing_date)`. **Grain historique/physique
    :** `(model_run_id,record_key)` ; version=H(run,key), une seule contribution par unité dans un run. Les clés
    métier et de dimensions sont conservées ci-dessous. Rafraîchissement manuel à la demande. Histoire et révisions
    conservées ; publication contrôlée.'
  config:
    tags: &id003
    - dtr
  columns:
  - name: model_run_id
    data_type: String
    description: Identifiant de la recomposition complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: SHA256 de la liste ordonnée des éléments du grain indiquée dans la fiche ; sérialisation canonique
      commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: SHA256 de (model_run_id, record_key).
  - name: row_hash
    data_type: String
    description: SHA256 du payload ordonné de la fiche, hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Instant de calcul du run ; aucune substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Version immuable des règles et référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Borne des entrées figées ; héritée du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Tenant des abonnements et de la société.
  - name: company_key
    data_type: String
    description: Identité stable de société ; aucune clé société inventée pour une ligne non rattachable.
  - name: company_id
    data_type: Nullable(Int64)
    description: Identifiant Boond lorsque résolu.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version descriptive de la société à la clôture.
  - name: company_name
    data_type: Nullable(String)
    description: dim_company.company_name, N:0..1 par run et version.
  - name: closing_date
    data_type: Date
    description: Alias de month_end_date, fct_subscription_month_end/fct_mrr_movement après préagrégation.
  - name: previous_closing_date
    data_type: Date
    description: Alias de fct_mrr_movement.previous_month_end_date ; sinon calendrier Paris du mois précédent.
  - name: is_active_begin
    data_type: Nullable(Bool)
    description: Au moins une ligne active au début ; NULL si la clôture précédente n'est pas suffisamment observable.
  - name: is_active_end
    data_type: Nullable(Bool)
    description: Au moins une ligne active à la clôture courante, règle état 1 + service en cours avec date de fin
      inclusive.
  - name: nb_active_lines_begin
    data_type: Nullable(UInt64)
    description: Somme des indicateurs d'activité de lignes de la clôture précédente si couverture connue.
  - name: nb_active_lines_end
    data_type: Nullable(UInt64)
    description: Somme des indicateurs d'activité de lignes de la clôture courante si couverture connue.
  - name: sum_mrr_begin
    data_type: Nullable(Decimal(38,4))
    description: Somme des sum_active_mrr des lignes de la clôture précédente, après sélection du run et de l'unique
      version pertinente.
  - name: sum_mrr_end
    data_type: Nullable(Decimal(38,4))
    description: Somme des sum_active_mrr des lignes de la clôture courante ; aucun prorata.
  - name: sum_new_mrr_new
    data_type: Nullable(Decimal(38,4))
    description: Somme des contributions du fait de mouvements où new_mrr_component=New, retours compris.
  - name: sum_new_mrr_upsell
    data_type: Nullable(Decimal(38,4))
    description: Somme des contributions du fait où new_mrr_component=Upsell ; net des sociétés restées actives.
  - name: sum_new_mrr
    data_type: Nullable(Decimal(38,4))
    description: sum_new_mrr_new + sum_new_mrr_upsell si les deux composantes sont calculables.
  - name: sum_departure_mrr
    data_type: Nullable(Decimal(38,4))
    description: Perte positive des sociétés sortantes, issue du fait de mouvements.
  - name: sum_contraction_mrr
    data_type: Nullable(Decimal(38,4))
    description: Perte positive des sociétés actives aux deux clôtures et en baisse nette.
  - name: sum_churn_mrr
    data_type: Nullable(Decimal(38,4))
    description: sum_departure_mrr + sum_contraction_mrr si les composantes sont calculables.
  - name: sum_other_mrr_delta
    data_type: Nullable(Decimal(38,4))
    description: Decimal0 uniquement quand les deux clôtures sont comparables et toutes variations classées new/upsell/departure/contraction/stable
      ; NULL si movement_kind=unknown ou correction non classée. Aucun résidu transformé en correction/churn.
  - name: sum_reconciliation_gap
    data_type: Nullable(Decimal(38,4))
    description: sum_mrr_end - sum_mrr_begin - sum_new_mrr + sum_churn_mrr - sum_other_mrr_delta, si tous les termes
      sont calculables.
  - name: is_portfolio_entrant
    data_type: Nullable(Bool)
    description: Non actif début et actif fin ; retours compris. Activité indépendante d'un montant nul.
  - name: is_departure
    data_type: Nullable(Bool)
    description: Actif début et non actif fin.
  - name: is_contraction
    data_type: Nullable(Bool)
    description: Actif aux deux clôtures et MRR total fin < début.
  - name: is_first_acquisition
    data_type: Nullable(Bool)
    description: true si first_acquisition_status=first_proven, false si return_proven, NULL si unknown selon D27
      ; un entrant seul ne prouve jamais première acquisition.
  - name: is_begin_observable
    data_type: Bool
    description: Clôture précédente suffisamment couverte selon le contrôle source déclaré.
  - name: is_end_observable
    data_type: Bool
    description: Clôture courante suffisamment couverte selon le contrôle source déclaré.
  - name: calculation_status
    data_type: String
    description: ready/partial/blocked/not_applicable ; ne pas publier un portefeuille incomplet comme exhaustif.
  - name: status_reason
    data_type: Nullable(String)
    description: incomplete_history, unknown_activity, unresolved_company, unknown_amount, unclassified_correction,
      ou motif upstream.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id003
- name: dtr_stage_visits
  description: '**Grain métier :** tenant_id × visit_key ; un passage continu d''une opportunité dans une étape.
