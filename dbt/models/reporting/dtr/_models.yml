    description: Pour tenant demo_crm, paramètre case_rules.demo_stage_ids=[24]. Q11(document 03) vérifie code24
      Show Boond dans les versions fr du 2025-03-10 09:00:00 UTC et du 2025-12-08 10:00:00 UTC. is_demo_stage=true
      seulement si stage_id=24 ET version dim_stage contenant ce mapping valide à l'instant de la période/observation
      ; avant première preuve de mapping ou sans version pertinente=>NULL+missing_stage_rule, jamais rétroprojection.
      Ce code ne définit ni ordre obligatoire ni règle d'un autre tenant.
