    description: Début du passage non connu avant la première observation.
  - name: is_open_visit
    data_type: Bool
    description: État à la borne du run ; information descriptive, à recalculer pour une observation passée.
  - name: completed_duration_seconds
    data_type: Nullable(Float64)
