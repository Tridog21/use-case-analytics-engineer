  - name: demo_interval_key
    data_type: String
    description: Identité logique de l'intervalle canonique ; jamais construit depuis simple ordre d'actions d'un
      contact ambigu.
  - name: demo_journey_id
    data_type: Nullable(String)
    description: Alias explicite de fct_demo_interval.demo_journey_key ; identité de parcours démontré, jamais id
      naturel inventé.
  - name: start_action_id
    data_type: Nullable(Int64)
    description: Action du premier événement, avec tenant.
  - name: end_action_id
    data_type: Nullable(Int64)
    description: Action du second événement.
  - name: start_action_key
    data_type: Nullable(String)
    description: Identité stable de l'action initiale.
  - name: end_action_key
    data_type: Nullable(String)
    description: Identité stable de l'action finale.
  - name: opportunity_key
    data_type: Nullable(String)
    description: Dossier prouvé du parcours.
  - name: opportunity_id
    data_type: Nullable(Int64)
    description: Identifiant Boond du dossier.
  - name: company_key
    data_type: Nullable(String)
    description: Société cohérente des événements reliés.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version descriptive de société au contexte retenu.
  - name: company_name
    data_type: Nullable(String)
    description: dim_company.company_name.
  - name: from_demo_step
    data_type: Nullable(String)
    description: 'Étape de sous-parcours explicitement définie : demande/séance1/complément, sans les confondre
      avec phase commerciale.'
  - name: to_demo_step
    data_type: Nullable(String)
    description: Étape finale explicitement définie.
  - name: started_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Événement initial admissible selon sa preuve et sa date.
  - name: ended_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Événement final admissible et relié.
  - name: elapsed_duration_seconds
    data_type: Nullable(Float64)
    description: (ended_at-started_at en ms)/1000 si les deux dates/événements et leur lien sont admissibles.
  - name: elapsed_duration_days
    data_type: Nullable(Float64)
    description: elapsed_duration_seconds/86400 ; NULL sans intervalle démontré.
  - name: time_basis
    data_type: String
    description: Provenance des événements et dates, sans assimilation agenda/tenue.
  - name: link_status
    data_type: String
    description: proven/candidate/ambiguous/missing selon le chaînage.
  - name: is_interval_calculable
    data_type: Bool
    description: link_status prouvé ET bornes connues/ordonnées ET événements admissibles ET statut de mesure valide
      ; false sinon.
  - name: is_team_filter_available
    data_type: Bool
    description: false dans cette v1 sans duration_team_rule de sous-parcours explicitement validée ; team_key descriptive
      n'autorise pas le filtre.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Type commercial du dossier dans le contexte retenu ; ne désigne pas la composante financière New/Upsell.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Identité stable du type commercial.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Version de dim_sale_type pertinente.
  - name: sale_type_label
    data_type: Nullable(String)
    description: dim_sale_type.sale_type_label par run+version, N:0..1.
  - name: team_key
    data_type: Nullable(String)
    description: Équipe proposée/prouvée seulement si attribution spécifique établie.
  - name: team_version_key
    data_type: Nullable(String)
    description: Version pertinente de l'équipe.
  - name: team_name
    data_type: Nullable(String)
    description: dim_team.team_name.
  - name: calculation_status
    data_type: String
    description: ready/partial/blocked/not_applicable ; ready n'efface pas les réserves distinctes de couverture.
  - name: status_reason
    data_type: Nullable(String)
    description: Motif explicite, stable et documenté ; plusieurs motifs séparés de façon canonique si nécessaire.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id010
