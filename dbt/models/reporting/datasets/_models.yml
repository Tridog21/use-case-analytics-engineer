version: 2
models:
- name: dataset_sales_objectives_month
  description: '**Grain métier et version :** exactement celui de `dtr_sales_objectives_month` : tenant_id × month_date
    × source_segment × metric_code ; segment Sales de la cible, équipe résolue seulement si mapping univoque. Une
    seule publication est visible ; identité et version sont conservées sans recalcul. Aucun total ni ligne artificielle
    n''est ajouté. Rafraîchissement manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - dataset
  columns:
  - name: model_run_id
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.model_run_id. Identifiant de la recomposition
      complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.record_key. SHA256 de la liste ordonnée
      des éléments du grain indiquée dans la fiche ; sérialisation canonique commune, jamais simple concaténation
      ambiguë.
  - name: record_version_key
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.record_version_key. SHA256 de (model_run_id,
      record_key).
  - name: row_hash
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.row_hash. SHA256 du payload ordonné de
      la fiche, hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_sales_objectives_month.calculated_at. Instant de calcul du run
      ; aucune substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.rule_version. Version immuable des règles
      et référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_sales_objectives_month.input_cutoff_at. Borne des entrées figées
      ; héritée du manifeste de run.
  - name: tenant_id
    data_type: String
    description: 'Projection sans changement de dtr_sales_objectives_month.tenant_id. Fait : tenant de la comparaison.'
  - name: month_date
    data_type: Date
    description: 'Projection sans changement de dtr_sales_objectives_month.month_date. Fait : premier jour du mois
      de reporting Europe/Paris.'
  - name: source_segment
    data_type: String
    description: 'Projection sans changement de dtr_sales_objectives_month.source_segment. fct_sales_objectives_month.source_segment
      : SMB/LA/ES ; identité du segment de cible sans fabriquer une businessunit.'
  - name: team_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_sales_objectives_month.team_key. fct_sales_objectives_month.team_key
      ; NULL si mapping source_segment→équipe non résolu. La clé du grain utilise source_segment pour préserver
      les cibles non rapprochées.
  - name: team_version_key
    data_type: Nullable(String)
    description: 'Projection sans changement de dtr_sales_objectives_month.team_version_key. Fait : version pertinente
      de l''équipe ; NULL si mapping non résolu.'
  - name: team_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_sales_objectives_month.team_name. dim_team.team_name, jointure
      par model_run_id + team_version_key.
  - name: metric_code
    data_type: String
    description: 'Projection sans changement de dtr_sales_objectives_month.metric_code. Fait : mrr_signed, pipeline_generated,
      pipeline_weighted ou demos.'
  - name: metric_key
    data_type: String
    description: 'Projection sans changement de dtr_sales_objectives_month.metric_key. Fait : identité de l''indicateur.'
  - name: metric_version_key
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.metric_version_key. Version de dim_metric
      utilisée par le run.
  - name: metric_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_sales_objectives_month.metric_label. dim_metric.metric_label
      ; une ligne de dimension au plus.
  - name: value_unit
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.value_unit. fct_sales_objectives_month.value_unit,
      déclaration attendue de mesure (peut marquer pipeline non confirmé) ; ne prouve pas la comparabilité du réalisé.
      Ce dernier reste NULL sans unité validée.
  - name: actual_value
    data_type: Nullable(Decimal(38,4))
    description: 'Projection sans changement de dtr_sales_objectives_month.actual_value. Fait : réalisé de la population
      compatible, jamais un candidat monétaire promu sans validation.'
  - name: target_value
    data_type: Nullable(Decimal(38,4))
    description: 'Projection sans changement de dtr_sales_objectives_month.target_value. Fait : cible versionnée
      de la même équipe et du même mois.'
  - name: variance_value
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_sales_objectives_month.variance_value. actual_value - target_value
      seulement si les deux valeurs et leur comparabilité sont connues.
  - name: attainment_rate
    data_type: Nullable(Float64)
    description: Projection sans changement de dtr_sales_objectives_month.attainment_rate. actual_value / target_value
      si cible > 0 et valeurs comparables ; affichage ×100 dans la BI.
  - name: is_population_compatible
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_sales_objectives_month.is_population_compatible. Population4/7
      décidée D22 ; compatibilité d’unité/date vérifiée séparément, NULL si preuve d’unité manque.
  - name: nb_source_contributions
    data_type: Nullable(UInt64)
    description: Projection sans changement de dtr_sales_objectives_month.nb_source_contributions. Nombre de contributions
      logiques examinées dans le réalisé, s'il est disponible dans le fait.
  - name: nb_uncalculable_contributions
    data_type: Nullable(UInt64)
    description: Projection sans changement de dtr_sales_objectives_month.nb_uncalculable_contributions. Nombre
      de contributions dont le calcul reste inconnu ; ne prouve pas à lui seul la complétude de la source.
  - name: calculation_status
    data_type: String
    description: Projection sans changement de dtr_sales_objectives_month.calculation_status. ready/partial/blocked/not_applicable
      ; statut transmis et combiné aux contrôles de jointure.
  - name: status_reason
    data_type: Nullable(String)
    description: 'Projection sans changement de dtr_sales_objectives_month.status_reason. Motif explicite : unconfirmed_amount_unit,
      missing_team_mapping, missing_demo_completion_proof, incompatible_population, missing_target, zero_target,
      ou motif du fait.'
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id001
- name: dataset_funnel_progress
  description: '**Grain métier et version :** exactement celui de `dtr_funnel_progress` : tenant_id × opportunity_key
    × définition de parcours × anchor_at × target_stage_id ; une contribution de dossier par étape cible. Une seule
    publication est visible ; identité et version sont conservées sans recalcul. Aucun total ni ligne artificielle
    n''est ajouté. Rafraîchissement manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id002
    - dataset
  columns:
  - name: model_run_id
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.model_run_id. Identifiant de la recomposition
      complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.record_key. SHA256 de la liste ordonnée des éléments
      du grain indiquée dans la fiche ; sérialisation canonique commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.record_version_key. SHA256 de (model_run_id,
      record_key).
  - name: row_hash
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.row_hash. SHA256 du payload ordonné de la fiche,
      hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_funnel_progress.calculated_at. Instant de calcul du run ; aucune
      substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.rule_version. Version immuable des règles et
      référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_funnel_progress.input_cutoff_at. Borne des entrées figées ; héritée
      du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.tenant_id. Tenant Boond conservé dans les identités
      et jointures.
  - name: opportunity_key
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.opportunity_key. Identité stable tenant + opportunité.
  - name: opportunity_id
    data_type: Int64
    description: Projection sans changement de dtr_funnel_progress.opportunity_id. Identifiant Boond du dossier,
      pour investigation.
  - name: company_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.company_key. Identité stable de société résolue
      au contexte retenu.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.company_version_key. Version de société pertinente
      au contexte retenu.
  - name: company_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_funnel_progress.company_id. Identifiant Boond de la société.
  - name: company_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.company_name. dim_company.company_name par run+company_version_key,
      N:0..1.
  - name: followup_key
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.followup_key. Identité de la contribution canonique
      de suivi.
  - name: followup_definition_key
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.followup_definition_key. Définition versionnée
      du parcours et de l'étape cible ; ne pas additionner des définitions différentes.
  - name: followup_definition_version_key
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.followup_definition_version_key. Version de dim_followup_definition
      utilisée.
  - name: created_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.created_at. Création métier Boond, ancrage d'entrée
      du pipeline.
  - name: anchor_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.anchor_at. Ancrage de définition D17/D18 ; NULL
      et qualité si date d’entrée non observable, pas règle indécise.
  - name: cohort_month
    data_type: Nullable(Date)
    description: Projection sans changement de dtr_funnel_progress.cohort_month. Mois de création Paris, filtre
      cohorte du tunnel.
  - name: sale_path_code
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.sale_path_code. dim_sale_type.sale_type_code
      associé au type d'ancrage ; aucune déduction du parcours depuis un code d'étape.
  - name: target_stage_id
    data_type: Int64
    description: Projection sans changement de dtr_funnel_progress.target_stage_id. Étape cible de la ligne.
  - name: target_stage_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.target_stage_key. Identité stable de l'étape
      cible.
  - name: target_stage_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.target_stage_version_key. Version de la cible.
  - name: target_stage_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.target_stage_label. Libellé dim_stage de la cible
      par run+version.
  - name: funnel_position
    data_type: Nullable(UInt16)
    description: Projection sans changement de dtr_funnel_progress.funnel_position. Position explicite dans le parcours
      validé ; jamais tri du code numérique.
  - name: previous_target_stage_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_funnel_progress.previous_target_stage_id. Étape précédente définie
      du même parcours, NULL pour la première.
  - name: first_reached_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.first_reached_at. Première entrée admissible
      connue dans la cible après ancrage ; NULL n'est pas preuve d'échec.
  - name: first_reached_observed_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.first_reached_observed_at. Première preuve d'observation
      en cible, utilisable comme borne supérieure d'atteinte sans inventer une entrée exacte.
  - name: previous_stage_first_reached_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.previous_stage_first_reached_at. Première atteinte
      admissible de l'étape précédente selon définition.
  - name: transition_reached_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.transition_reached_at. Alias de first_reached_at
      du suivi stage_transition sélectionné, après ancrage source ; jointure explicitée, pas colonne supposée du
      fait.
  - name: is_eligible
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_funnel_progress.is_eligible. Admissibilité du dossier à la population
      commune du parcours.
  - name: is_definition_enabled
    data_type: Bool
    description: Projection sans changement de dtr_funnel_progress.is_definition_enabled. dim_followup_definition.is_enabled
      ; false si définition absente/désactivée, avec blocked_definition dans disponibilité.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.coverage_start_at. Borne de couverture historique
      de la population suivie.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_funnel_progress.coverage_end_at. Fin de couverture connue.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_funnel_progress.is_history_complete. Couverture permettant de
      distinguer non atteinte observée et absence de trace.
  - name: reached_target
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_funnel_progress.reached_target. Résultat à l'observation du run
      ; recalculer par les timestamps pour une autre observation.
  - name: denominator_contribution
    data_type: Nullable(UInt8)
    description: Projection sans changement de dtr_funnel_progress.denominator_contribution. Contribution du dossier
      admissible au dénominateur de la définition ; NULL si non calculable.
  - name: converted_contribution
    data_type: Nullable(UInt8)
    description: Projection sans changement de dtr_funnel_progress.converted_contribution. Contribution admissible
      convertie, interprétée avec son ancrage/horizon ; ne pas sommer sans restriction d'observation.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_funnel_progress.sale_type_id. Type commercial du dossier dans
      le contexte retenu ; ne désigne pas la composante financière New/Upsell.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.sale_type_key. Identité stable du type commercial.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.sale_type_version_key. Version de dim_sale_type
      pertinente.
  - name: sale_type_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.sale_type_label. dim_sale_type.sale_type_label
      par run+version, N:0..1.
  - name: channel_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.channel_key. Alias explicite de acquisition_channel_key
      du fait ; canal officiel d'entrée, NULL avant règle validée.
  - name: channel_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.channel_version_key. Version de mapping du canal,
      indépendante des sources candidates conservées.
  - name: channel_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.channel_label. dim_channel.channel_label par
      run+version, N:0..1.
  - name: channel_candidate_code
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.channel_candidate_code. Valeur candidate Boond
      conservée sans la transformer en canal officiel.
  - name: is_channel_calculable
    data_type: Bool
    description: Projection sans changement de dtr_funnel_progress.is_channel_calculable. false si origine à création
      ou mapping de valeur est manquant ; règle D24 définie, filtre disponible sur les lignes résolues.
  - name: employee_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.employee_key. Identité stable du responsable
      retenu.
  - name: employee_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.employee_version_key. Version descriptive du
      responsable.
  - name: employee_display_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.employee_display_name. dim_employee.employee_display_name
      par run+version, N:0..1.
  - name: team_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.team_key. Équipe historiquement retenue si mapping
      et attribution validés.
  - name: team_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.team_version_key. Version de l'équipe pertinente.
  - name: team_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.team_name. dim_team.team_name par run+version,
      N:0..1.
  - name: is_team_calculable
    data_type: Bool
    description: Projection sans changement de dtr_funnel_progress.is_team_calculable. false pour rattachement à
      entrée/événement inconnu ou ambigu ; sinon true y compris KAM connue, indépendamment de son absence de cible
      D23.
  - name: calculation_status
    data_type: String
    description: Projection sans changement de dtr_funnel_progress.calculation_status. ready/partial/blocked/not_applicable
      ; ready n'efface pas les réserves distinctes de couverture.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection sans changement de dtr_funnel_progress.status_reason. Motif explicite, stable et documenté
      ; plusieurs motifs séparés de façon canonique si nécessaire.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id002
- name: dataset_company_mrr_month
  description: '**Grain métier et version :** exactement celui de `dtr_company_mrr_month` : tenant_id × company_key
    × closing_date ; une ligne par société aux deux clôtures comparées. Une seule publication est visible ; identité
    et version sont conservées sans recalcul. Aucun total ni ligne artificielle n''est ajouté. Rafraîchissement
