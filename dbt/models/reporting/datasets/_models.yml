  - name: rule_version
    data_type: String
    description: Projection sans changement de dtr_company_mrr_month.rule_version. Version immuable des règles et
      référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_company_mrr_month.input_cutoff_at. Borne des entrées figées ;
      héritée du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Projection sans changement de dtr_company_mrr_month.tenant_id. Tenant des abonnements et de la
      société.
  - name: company_key
    data_type: String
    description: Projection sans changement de dtr_company_mrr_month.company_key. Identité stable de société ; aucune
      clé société inventée pour une ligne non rattachable.
  - name: company_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_company_mrr_month.company_id. Identifiant Boond lorsque résolu.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_company_mrr_month.company_version_key. Version descriptive de
      la société à la clôture.
  - name: company_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_company_mrr_month.company_name. dim_company.company_name, N:0..1
      par run et version.
  - name: closing_date
    data_type: Date
    description: Projection sans changement de dtr_company_mrr_month.closing_date. Alias de month_end_date, fct_subscription_month_end/fct_mrr_movement
      après préagrégation.
  - name: previous_closing_date
    data_type: Date
    description: Projection sans changement de dtr_company_mrr_month.previous_closing_date. Alias de fct_mrr_movement.previous_month_end_date
      ; sinon calendrier Paris du mois précédent.
  - name: is_active_begin
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_company_mrr_month.is_active_begin. Au moins une ligne active
      au début ; NULL si la clôture précédente n'est pas suffisamment observable.
  - name: is_active_end
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_company_mrr_month.is_active_end. Au moins une ligne active à
      la clôture courante, règle état 1 + service en cours avec date de fin inclusive.
  - name: nb_active_lines_begin
    data_type: Nullable(UInt64)
    description: Projection sans changement de dtr_company_mrr_month.nb_active_lines_begin. Somme des indicateurs
      d'activité de lignes de la clôture précédente si couverture connue.
  - name: nb_active_lines_end
    data_type: Nullable(UInt64)
    description: Projection sans changement de dtr_company_mrr_month.nb_active_lines_end. Somme des indicateurs
      d'activité de lignes de la clôture courante si couverture connue.
  - name: sum_mrr_begin
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_mrr_begin. Somme des sum_active_mrr des
      lignes de la clôture précédente, après sélection du run et de l'unique version pertinente.
  - name: sum_mrr_end
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_mrr_end. Somme des sum_active_mrr des lignes
      de la clôture courante ; aucun prorata.
  - name: sum_new_mrr_new
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_new_mrr_new. Somme des contributions du
      fait de mouvements où new_mrr_component=New, retours compris.
  - name: sum_new_mrr_upsell
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_new_mrr_upsell. Somme des contributions
      du fait où new_mrr_component=Upsell ; net des sociétés restées actives.
  - name: sum_new_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_new_mrr. sum_new_mrr_new + sum_new_mrr_upsell
      si les deux composantes sont calculables.
  - name: sum_departure_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_departure_mrr. Perte positive des sociétés
      sortantes, issue du fait de mouvements.
  - name: sum_contraction_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_contraction_mrr. Perte positive des sociétés
      actives aux deux clôtures et en baisse nette.
  - name: sum_churn_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_churn_mrr. sum_departure_mrr + sum_contraction_mrr
      si les composantes sont calculables.
  - name: sum_other_mrr_delta
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_other_mrr_delta. Decimal0 uniquement quand
      les deux clôtures sont comparables et toutes variations classées new/upsell/departure/contraction/stable ;
      NULL si movement_kind=unknown ou correction non classée. Aucun résidu transformé en correction/churn.
  - name: sum_reconciliation_gap
    data_type: Nullable(Decimal(38,4))
    description: Projection sans changement de dtr_company_mrr_month.sum_reconciliation_gap. sum_mrr_end - sum_mrr_begin
      - sum_new_mrr + sum_churn_mrr - sum_other_mrr_delta, si tous les termes sont calculables.
  - name: is_portfolio_entrant
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_company_mrr_month.is_portfolio_entrant. Non actif début et actif
      fin ; retours compris. Activité indépendante d'un montant nul.
  - name: is_departure
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_company_mrr_month.is_departure. Actif début et non actif fin.
  - name: is_contraction
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_company_mrr_month.is_contraction. Actif aux deux clôtures et
      MRR total fin < début.
  - name: is_first_acquisition
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_company_mrr_month.is_first_acquisition. true si first_acquisition_status=first_proven,
      false si return_proven, NULL si unknown selon D27 ; un entrant seul ne prouve jamais première acquisition.
  - name: is_begin_observable
    data_type: Bool
    description: Projection sans changement de dtr_company_mrr_month.is_begin_observable. Clôture précédente suffisamment
      couverte selon le contrôle source déclaré.
  - name: is_end_observable
    data_type: Bool
    description: Projection sans changement de dtr_company_mrr_month.is_end_observable. Clôture courante suffisamment
      couverte selon le contrôle source déclaré.
  - name: calculation_status
    data_type: String
    description: Projection sans changement de dtr_company_mrr_month.calculation_status. ready/partial/blocked/not_applicable
      ; ne pas publier un portefeuille incomplet comme exhaustif.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection sans changement de dtr_company_mrr_month.status_reason. incomplete_history, unknown_activity,
      unresolved_company, unknown_amount, unclassified_correction, ou motif upstream.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id003
- name: dataset_stage_visits
  description: '**Grain métier et version :** exactement celui de `dtr_stage_visits` : tenant_id × visit_key ; un
    passage continu d''une opportunité dans une étape. Une seule publication est visible ; identité et version sont
    conservées sans recalcul. Aucun total ni ligne artificielle n''est ajouté. Rafraîchissement manuel à la demande.
    Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id004
    - dataset
  columns:
  - name: model_run_id
    data_type: String
    description: Projection sans changement de dtr_stage_visits.model_run_id. Identifiant de la recomposition complète
      et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: Projection sans changement de dtr_stage_visits.record_key. SHA256 de la liste ordonnée des éléments
      du grain indiquée dans la fiche ; sérialisation canonique commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: Projection sans changement de dtr_stage_visits.record_version_key. SHA256 de (model_run_id, record_key).
  - name: row_hash
    data_type: String
    description: Projection sans changement de dtr_stage_visits.row_hash. SHA256 du payload ordonné de la fiche,
      hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_stage_visits.calculated_at. Instant de calcul du run ; aucune
      substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Projection sans changement de dtr_stage_visits.rule_version. Version immuable des règles et référentiels
      utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_stage_visits.input_cutoff_at. Borne des entrées figées ; héritée
      du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Projection sans changement de dtr_stage_visits.tenant_id. Tenant Boond conservé dans les identités
      et jointures.
  - name: opportunity_key
    data_type: String
    description: Projection sans changement de dtr_stage_visits.opportunity_key. Identité stable tenant + opportunité.
  - name: opportunity_id
    data_type: Int64
    description: Projection sans changement de dtr_stage_visits.opportunity_id. Identifiant Boond du dossier, pour
      investigation.
  - name: company_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.company_key. Identité stable de société résolue
      au contexte retenu.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.company_version_key. Version de société pertinente
      au contexte retenu.
  - name: company_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_stage_visits.company_id. Identifiant Boond de la société.
  - name: company_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.company_name. dim_company.company_name par run+company_version_key,
      N:0..1.
  - name: visit_key
    data_type: String
    description: Projection sans changement de dtr_stage_visits.visit_key. Identité logique stable du passage ;
      distincte des versions du run.
  - name: visit_rank
    data_type: UInt32
    description: Projection sans changement de dtr_stage_visits.visit_rank. Rang observé du passage dans le parcours
      ; NULL si le classement ne peut être établi sans ambiguïté.
  - name: stage_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_stage_visits.stage_id. Code de l'étape observée ; les codes ne
      donnent aucun ordre de funnel.
  - name: stage_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.stage_key. Identité stable de l'étape.
  - name: stage_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.stage_version_key. Version pertinente de dim_stage.
  - name: stage_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.stage_label. dim_stage.stage_label par run+version.
  - name: entered_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_stage_visits.entered_at. Entrée du passage prouvée ou proxy observé
      explicitement qualifié ; NULL si début non observable.
  - name: exited_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_stage_visits.exited_at. Sortie d'étape observée admissible ;
      une suppression ne crée pas cette sortie métier.
  - name: first_observed_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_stage_visits.first_observed_at. Première observation disponible
      du passage ; borne de couverture distincte d'une entrée.
  - name: observation_end_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_stage_visits.observation_end_at. Alias explicite de fct_stage_visit.observation_ended_at
      ; fin technique d'observation, distincte d'une sortie métier.
  - name: event_time_basis
    data_type: String
    description: 'Projection sans changement de dtr_stage_visits.event_time_basis. fct_stage_visit.event_time_basis
      : cdc_transition_proxy/business_proven/left_censored/observation_only ; aucun proxy rebaptisé date métier
      certaine.'
  - name: is_entry_date_known
    data_type: Bool
    description: Projection sans changement de dtr_stage_visits.is_entry_date_known. entered_at IS NOT NULL ; ce
      test de connaissance ne donne aucune date aux entrées inconnues.
  - name: is_left_censored
    data_type: Bool
    description: Projection sans changement de dtr_stage_visits.is_left_censored. Début du passage non connu avant
      la première observation.
  - name: is_open_visit
    data_type: Bool
    description: Projection sans changement de dtr_stage_visits.is_open_visit. État à la borne du run ; information
      descriptive, à recalculer pour une observation passée.
  - name: completed_duration_seconds
    data_type: Nullable(Float64)
    description: Projection sans changement de dtr_stage_visits.completed_duration_seconds. (exited_at - entered_at)
      en millisecondes /1000, si les deux bornes admissibles et la continuité sont connues.
  - name: completed_duration_days
    data_type: Nullable(Float64)
    description: Projection sans changement de dtr_stage_visits.completed_duration_days. completed_duration_seconds
      /86400, sans arrondi intermédiaire.
  - name: entry_employee_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.entry_employee_key. Responsable à l'entrée, descriptif
      uniquement ; NULL si entrée ou attribution inconnue.
  - name: entry_employee_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.entry_employee_version_key. Version du responsable
      à l'entrée.
  - name: entry_team_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.entry_team_key. Équipe à l'entrée, descriptif ;
      n'autorise pas un filtre de durée sur toute la responsabilité.
  - name: entry_team_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.entry_team_version_key. Version de l'équipe à l'entrée.
  - name: entry_team_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.entry_team_name. Libellé descriptif par run+entry_team_version_key.
  - name: is_team_filter_available
    data_type: Bool
    description: Projection sans changement de dtr_stage_visits.is_team_filter_available. true si équipe à entrée
      connue D25 ; false sinon, sans recours à équipe actuelle.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_stage_visits.coverage_start_at. Début de couverture continue
      connu pour le passage.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_stage_visits.coverage_end_at. Fin de couverture continue si bornée
      ; NULL ne prouve pas une couverture infinie.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_stage_visits.is_history_complete. Complétude déclarée de la séquence
      utile ; aucune inférence depuis seul min/max CDC.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_stage_visits.sale_type_id. Type commercial du dossier dans le
      contexte retenu ; ne désigne pas la composante financière New/Upsell.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.sale_type_key. Identité stable du type commercial.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.sale_type_version_key. Version de dim_sale_type
      pertinente.
  - name: sale_type_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.sale_type_label. dim_sale_type.sale_type_label par
      run+version, N:0..1.
  - name: channel_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.channel_key. Alias explicite de acquisition_channel_key
      du fait ; canal officiel d'entrée, NULL avant règle validée.
  - name: channel_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.channel_version_key. Version de mapping du canal,
      indépendante des sources candidates conservées.
  - name: channel_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.channel_label. dim_channel.channel_label par run+version,
      N:0..1.
  - name: channel_candidate_code
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.channel_candidate_code. Valeur candidate Boond conservée
      sans la transformer en canal officiel.
  - name: is_channel_calculable
    data_type: Bool
    description: Projection sans changement de dtr_stage_visits.is_channel_calculable. false si origine à création
      ou mapping de valeur est manquant ; règle D24 définie, filtre disponible sur les lignes résolues.
  - name: calculation_status
    data_type: String
    description: Projection sans changement de dtr_stage_visits.calculation_status. ready/partial/blocked/not_applicable
      ; ready n'efface pas les réserves distinctes de couverture.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection sans changement de dtr_stage_visits.status_reason. Motif explicite, stable et documenté
      ; plusieurs motifs séparés de façon canonique si nécessaire.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id004
- name: dataset_cohort_outcomes
  description: '**Grain métier et version :** exactement celui de `dtr_cohort_outcomes` : tenant_id × opportunity_key
    × followup_definition_key × anchor_at × horizon_days ; une opportunité de sa cohorte de création par horizon.
    Une seule publication est visible ; identité et version sont conservées sans recalcul. Aucun total ni ligne
    artificielle n''est ajouté. Rafraîchissement manuel à la demande. Histoire et révisions conservées ; publication
    contrôlée.'
  config:
    tags: &id005
    - dataset
  columns:
  - name: model_run_id
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.model_run_id. Identifiant de la recomposition
      complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.record_key. SHA256 de la liste ordonnée des éléments
      du grain indiquée dans la fiche ; sérialisation canonique commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.record_version_key. SHA256 de (model_run_id,
      record_key).
  - name: row_hash
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.row_hash. SHA256 du payload ordonné de la fiche,
      hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_cohort_outcomes.calculated_at. Instant de calcul du run ; aucune
      substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.rule_version. Version immuable des règles et
      référentiels utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_cohort_outcomes.input_cutoff_at. Borne des entrées figées ; héritée
      du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.tenant_id. Tenant Boond conservé dans les identités
      et jointures.
  - name: opportunity_key
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.opportunity_key. Identité stable tenant + opportunité.
  - name: opportunity_id
    data_type: Int64
    description: Projection sans changement de dtr_cohort_outcomes.opportunity_id. Identifiant Boond du dossier,
      pour investigation.
  - name: company_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_cohort_outcomes.company_key. Identité stable de société résolue
      au contexte retenu.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_cohort_outcomes.company_version_key. Version de société pertinente
      au contexte retenu.
  - name: company_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_cohort_outcomes.company_id. Identifiant Boond de la société.
  - name: company_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_cohort_outcomes.company_name. dim_company.company_name par run+company_version_key,
      N:0..1.
  - name: followup_key
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.followup_key. Identité logique de l'observation
      du fait.
  - name: followup_definition_key
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.followup_definition_key. Identité de définition
      de suivi explicitement retenue.
  - name: followup_definition_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_cohort_outcomes.followup_definition_version_key. Version de la
      définition du même run.
  - name: created_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_cohort_outcomes.created_at. Création individuelle Boond, ancrage
      décidé ; les créations manquantes sont des anomalies de couverture hors cohorte calculable.
  - name: anchor_key
    data_type: String
    description: Projection sans changement de dtr_cohort_outcomes.anchor_key. fct_opportunity_followup.anchor_key
      ; identité source de l'ancrage, distincte de son timestamp éventuellement inconnu.
  - name: anchor_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_cohort_outcomes.anchor_at. Création individuelle pour cette définition,
      sans changement de cohorte sur réentrée.
  - name: cohort_month
    data_type: Nullable(Date)
    description: Projection sans changement de dtr_cohort_outcomes.cohort_month. Premier jour du mois civil de created_at
      en Europe/Paris.
  - name: horizon_days
    data_type: Nullable(UInt16)
    description: Projection sans changement de dtr_cohort_outcomes.horizon_days. 30,60 ou90 selon les horizons demandés.
  - name: horizon_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_cohort_outcomes.horizon_at. Ajouter horizon_days jours calendaires
      à la création en Europe/Paris à même heure locale, puis conserver l'instant UTC.
  - name: cohort_mature_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_cohort_outcomes.cohort_mature_at. max(horizon_at) parmi tous
      membres connus tenant/mois/type commercial/définition/horizon, AVANT filtres équipe et canal.
  - name: issue_at_horizon
    data_type: Nullable(String)
    description: Projection sans changement de dtr_cohort_outcomes.issue_at_horizon. open/won/lost/abandoned/unqualified/unknown
      lorsque horizon évalué ; nurturing=open. NULL si horizon non atteint au run.
  - name: is_eligible
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_cohort_outcomes.is_eligible. Admissibilité de l'unique ancrage
      dans la population de création ; ne pas exclure silencieusement un inconnu.
  - name: is_mature
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_cohort_outcomes.is_mature. horizon_at <= observation du run,
      conservé pour contrôle ; à recalculer si observation BI différente.
  - name: is_cohort_mature
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_cohort_outcomes.is_cohort_mature. cohort_mature_at <= observation
      du run ; à recalculer pour observation BI différente.
  - name: is_observable
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_cohort_outcomes.is_observable. L'histoire permet de déterminer
      le statut à horizon_at ; distinct de maturité.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_cohort_outcomes.coverage_start_at. Début observable de l'historique
      utile du dossier.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_cohort_outcomes.coverage_end_at. Fin observable connue.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Projection sans changement de dtr_cohort_outcomes.is_history_complete. Couverture déclarée ; la
      maturité ne prouve jamais l'exhaustivité des membres ni l'observabilité.
  - name: nb_cohort_membership
    data_type: UInt8
    description: Projection sans changement de dtr_cohort_outcomes.nb_cohort_membership. 1 pour cette identité admissible
      de cohorte/horizon ; effectif de base connu, pas à sommer entre horizons.
  - name: denominator_contribution
    data_type: Nullable(UInt8)
    description: Projection sans changement de dtr_cohort_outcomes.denominator_contribution. 1 pour le membre de
      base à horizon mature ; NULL pour non mature ou inadmissible non résolu. Les inconnus matures restent au dénominateur.
  - name: open_contribution
    data_type: Nullable(UInt8)
    description: Projection sans changement de dtr_cohort_outcomes.open_contribution. 1 si issue=open à horizon
      mature, 0 si une autre issue mature, NULL si horizon non mature.
  - name: won_contribution
    data_type: Nullable(UInt8)
    description: Projection sans changement de dtr_cohort_outcomes.won_contribution. Même convention pour won ;
      état 1 constitue victoire, état 14 ne crée pas une nouvelle ligne.
  - name: lost_contribution
    data_type: Nullable(UInt8)
    description: Projection sans changement de dtr_cohort_outcomes.lost_contribution. Même convention pour lost,
      distinct des abandons/nonqualifiés.
  - name: abandoned_contribution
    data_type: Nullable(UInt8)
    description: Projection sans changement de dtr_cohort_outcomes.abandoned_contribution. Même convention pour
      abandoned, conservé séparément.
