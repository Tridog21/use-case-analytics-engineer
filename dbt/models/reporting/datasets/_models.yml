- name: dataset_demo_intervals
  description: '**Grain métier et version :** exactement celui de `dtr_demo_intervals` : tenant_id × demo_interval_key
    ; intervalle entre deux événements reliés d''un parcours établi. Une seule publication est visible ; identité
    et version sont conservées sans recalcul. Aucun total ni ligne artificielle n''est ajouté. Rafraîchissement
    manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id010
    - dataset
  columns:
  - name: model_run_id
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.model_run_id. Identifiant de la recomposition
      complète et immuable ; hérité des entrées du même run.
  - name: record_key
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.record_key. SHA256 de la liste ordonnée des éléments
      du grain indiquée dans la fiche ; sérialisation canonique commune, jamais simple concaténation ambiguë.
  - name: record_version_key
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.record_version_key. SHA256 de (model_run_id, record_key).
  - name: row_hash
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.row_hash. SHA256 du payload ordonné de la fiche,
      hors colonnes techniques communes.
  - name: calculated_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_demo_intervals.calculated_at. Instant de calcul du run ; aucune
      substitution à une date métier.
  - name: rule_version
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.rule_version. Version immuable des règles et référentiels
      utilisés par le run.
  - name: input_cutoff_at
    data_type: DateTime64(3, 'UTC')
    description: Projection sans changement de dtr_demo_intervals.input_cutoff_at. Borne des entrées figées ; héritée
      du manifeste de run.
  - name: tenant_id
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.tenant_id. Tenant du parcours établi.
  - name: demo_interval_key
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.demo_interval_key. Identité logique de l'intervalle
      canonique ; jamais construit depuis simple ordre d'actions d'un contact ambigu.
  - name: demo_journey_id
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.demo_journey_id. Alias explicite de fct_demo_interval.demo_journey_key
      ; identité de parcours démontré, jamais id naturel inventé.
  - name: start_action_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_demo_intervals.start_action_id. Action du premier événement,
      avec tenant.
  - name: end_action_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_demo_intervals.end_action_id. Action du second événement.
  - name: start_action_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.start_action_key. Identité stable de l'action
      initiale.
  - name: end_action_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.end_action_key. Identité stable de l'action finale.
  - name: opportunity_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.opportunity_key. Dossier prouvé du parcours.
  - name: opportunity_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_demo_intervals.opportunity_id. Identifiant Boond du dossier.
  - name: company_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.company_key. Société cohérente des événements
      reliés.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.company_version_key. Version descriptive de société
      au contexte retenu.
  - name: company_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.company_name. dim_company.company_name.
  - name: from_demo_step
    data_type: Nullable(String)
    description: 'Projection sans changement de dtr_demo_intervals.from_demo_step. Étape de sous-parcours explicitement
      définie : demande/séance1/complément, sans les confondre avec phase commerciale.'
  - name: to_demo_step
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.to_demo_step. Étape finale explicitement définie.
  - name: started_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_demo_intervals.started_at. Événement initial admissible selon
      sa preuve et sa date.
  - name: ended_at
    data_type: Nullable(DateTime64(3, 'UTC'))
    description: Projection sans changement de dtr_demo_intervals.ended_at. Événement final admissible et relié.
  - name: elapsed_duration_seconds
    data_type: Nullable(Float64)
    description: Projection sans changement de dtr_demo_intervals.elapsed_duration_seconds. (ended_at-started_at
      en ms)/1000 si les deux dates/événements et leur lien sont admissibles.
  - name: elapsed_duration_days
    data_type: Nullable(Float64)
    description: Projection sans changement de dtr_demo_intervals.elapsed_duration_days. elapsed_duration_seconds/86400
      ; NULL sans intervalle démontré.
  - name: time_basis
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.time_basis. Provenance des événements et dates,
      sans assimilation agenda/tenue.
  - name: link_status
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.link_status. proven/candidate/ambiguous/missing
      selon le chaînage.
  - name: is_interval_calculable
    data_type: Bool
    description: Projection sans changement de dtr_demo_intervals.is_interval_calculable. link_status prouvé ET
      bornes connues/ordonnées ET événements admissibles ET statut de mesure valide ; false sinon.
  - name: is_team_filter_available
    data_type: Bool
    description: Projection sans changement de dtr_demo_intervals.is_team_filter_available. false dans cette v1
      sans duration_team_rule de sous-parcours explicitement validée ; team_key descriptive n'autorise pas le filtre.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Projection sans changement de dtr_demo_intervals.sale_type_id. Type commercial du dossier dans
      le contexte retenu ; ne désigne pas la composante financière New/Upsell.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.sale_type_key. Identité stable du type commercial.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.sale_type_version_key. Version de dim_sale_type
      pertinente.
  - name: sale_type_label
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.sale_type_label. dim_sale_type.sale_type_label
      par run+version, N:0..1.
  - name: team_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.team_key. Équipe proposée/prouvée seulement si
      attribution spécifique établie.
  - name: team_version_key
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.team_version_key. Version pertinente de l'équipe.
  - name: team_name
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.team_name. dim_team.team_name.
  - name: calculation_status
    data_type: String
    description: Projection sans changement de dtr_demo_intervals.calculation_status. ready/partial/blocked/not_applicable
      ; ready n'efface pas les réserves distinctes de couverture.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection sans changement de dtr_demo_intervals.status_reason. Motif explicite, stable et documenté
      ; plusieurs motifs séparés de façon canonique si nécessaire.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id010
- name: dataset_publication_status
  description: '**Couche/finalité** : dataset technique dtr_sales, fichier futur `dbt/models/reporting/datasets/dataset_publication_status.sql`,
    YAML `_models.yml`, tag dataset, matérialisation view. Grain publication/model_run_id × measure_id ; unicité
    du tuple. Expose les statuts même si un dataset de détail est vide, sans ligne artificielle dans celui-ci. Rafraîchissement
    par lecture du pointeur, aucune capture métier supplémentaire. Rafraîchissement manuel à la demande. Histoire
    et révisions conservées ; publication contrôlée.'
  config:
    tags:
    - dataset
  columns:
  - name: model_run_id
    data_type: String
    description: int_publication.model_run_id.
  - name: publication_key
    data_type: String
    description: int_publication.publication_key ; détecte une bascule entre plusieurs requêtes d'une page.
  - name: published_at
    data_type: DateTime64(3,'UTC')
    description: Instant de publication.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Cutoff des entrées du run publié.
  - name: rule_version
    data_type: String
    description: Version de règles/calcul.
  - name: measure_id
    data_type: String
    description: Identifiant du registre technique de disponibilité ci-dessous.
  - name: dataset_family
    data_type: String
    description: Famille métier cible ; ne modifie pas le grain de ses lignes.
  - name: availability_status
    data_type: String
    description: Domaine A.4/01 ; même statut que le contrôle candidat.
  - name: availability_reason
    data_type: Nullable(String)
    description: Code de motif ou NULL si available ; pas chaîne vide.
  - name: coverage_status
    data_type: String
    description: complete/partial/unconfirmed/not_applicable, indépendamment de maturité.
  - name: nb_expected
    data_type: Nullable(UInt64)
    description: Population attendue quand déterminable ; pas0 par défaut.
  - name: nb_known
    data_type: Nullable(UInt64)
    description: Population avec preuve/mesure admissible ; NULL si non déterminable.
  - name: data_coverage_end_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Dernière borne de couverture déclarée et justifiée ; max(updateDate) ne la fournit pas.
