      data_type: Nullable(DateTime64(3,'UTC'))
    - name: endDate
      description: Fin de la période facturée.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: averageDailyPriceExcludingTax
      description: Tarif de vente journalier moyen HT. Pour une ligne d'abonnement,
