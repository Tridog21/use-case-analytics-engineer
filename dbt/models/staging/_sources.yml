version: 2
sources:
- name: boond
  schema: '{{ var(''boond_source_schema'',''raw'') }}'
  description: Sources du case en lecture seule. Schéma de fixtures substituable dans
    une cible analytique isolée.
  tables:
  - name: opportunities
    description: Source physique en lecture seule ; toutes versions et colonnes conservées.
    columns:
    - name: meta.customer
      description: Code du client Boond (tenant) dont vient la ligne. Un seul tenant
        dans ce jeu.
      data_type: String
    - name: id
      description: Identifiant de l'enregistrement dans Boond. Le même `id` revient
        à chaque version.
      data_type: Int64
    - name: meta.deleted
      description: Vrai sur la version qui enregistre la suppression de l'enregistrement
        dans Boond.
      data_type: Bool
    - name: meta.ts
      description: 'Horodatage de la version : moment où la modification a été publiée
        par le flux CDC.'
      data_type: DateTime64(3,'UTC')
    - name: state
      description: 'Étape du besoin. Libellés et propriétés de chaque code dans le
        référentiel des étapes. Référence documentaire : raw.dictionaries.setting.state.opportunity
        ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: typeOf
      description: 'Type de besoin : nouveau client, upsell, formation… Référence
        documentaire : raw.dictionaries.setting.typeOf.project ; intégrité temporelle
        à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: title
      description: Intitulé libre du besoin.
      data_type: String
    - name: reference
      description: Référence lisible générée par Boond à la création.
      data_type: String
    - name: creationDate
      description: Date de création du besoin dans Boond.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: updateDate
      description: Date de la dernière modification de la fiche.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: startDate
      description: Date de démarrage souhaitée par le prospect.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: answerDate
      description: Date limite de réponse au prospect.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: closingDate
      description: Date de closing saisie par le commercial sur la fiche.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: turnoverEstimatedExcludingTax
      description: Montant estimé du besoin, hors taxes, saisi par le commercial.
      data_type: Nullable(Float64)
    - name: weighting
      description: Pondération du besoin en pourcentage.
      data_type: Nullable(Int64)
    - name: turnoverWeightedExcludingTax
      description: 'Montant pondéré : montant estimé × pondération.'
      data_type: Nullable(Float64)
    - name: exchangeRate
      description: Taux de change entre la devise du besoin et celle de l'agence.
      data_type: Nullable(Float64)
    - name: origin.typeOf
      description: 'Origine du besoin (canal par lequel il est arrivé). Référence
        documentaire : raw.dictionaries.setting.origin ; intégrité temporelle à contrôler
        hors staging.'
      data_type: Nullable(Int64)
    - name: origin.detail
      description: Précision libre sur l'origine.
      data_type: String
    - name: relationships.mainManager.data.id
      description: 'Responsable de l''enregistrement : le collaborateur qui le porte.
        Référence documentaire : raw.ressources.id ; intégrité temporelle à contrôler
        hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.createdBy.data.id
      description: 'Collaborateur (ou robot) qui a créé l''enregistrement. Référence
        documentaire : raw.ressources.id ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.company.data.id
      description: 'Société prospect ou cliente du besoin. Référence documentaire
        : raw.companies.id ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.contact.data.id
      description: 'Contact principal du besoin. Référence documentaire : raw.contacts.id
        ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.agency.data.id
      description: 'Agence Boond qui porte le besoin. Référence documentaire : raw.agencies.id
        ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: attributes
      description: 'Attributs complémentaires en JSON, dont `stateReason` : la raison
        de perte choisie dans la liste de l''étape.'
      data_type: String
  - name: actions
    description: Source physique en lecture seule ; toutes versions et colonnes conservées.
    columns:
    - name: meta.customer
      description: Code du client Boond (tenant) dont vient la ligne. Un seul tenant
        dans ce jeu.
      data_type: String
    - name: id
      description: Identifiant de l'enregistrement dans Boond. Le même `id` revient
        à chaque version.
      data_type: Int64
    - name: meta.deleted
      description: Vrai sur la version qui enregistre la suppression de l'enregistrement
        dans Boond.
      data_type: Bool
    - name: meta.ts
      description: 'Horodatage de la version : moment où la modification a été publiée
        par le flux CDC.'
      data_type: DateTime64(3,'UTC')
    - name: typeOf
      description: 'Type d''action : appel, démo, demande de démo… Référence documentaire
        : raw.dictionaries.setting.action.contact ; intégrité temporelle à contrôler
        hors staging.'
      data_type: Nullable(Int64)
    - name: title
      description: Intitulé de l'action.
      data_type: String
    - name: startDate
      description: Début de l'action dans l'agenda.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: endDate
      description: Fin de l'action dans l'agenda.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: creationDate
      description: Date de création de l'action.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: updateDate
      description: Date de la dernière modification.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: relationships.mainManager.data.id
      description: 'Responsable de l''enregistrement : le collaborateur qui le porte.
        Référence documentaire : raw.ressources.id ; intégrité temporelle à contrôler
        hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.createdBy.data.id
      description: 'Collaborateur (ou robot) qui a créé l''enregistrement. Référence
        documentaire : raw.ressources.id ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.company.data.id
      description: 'Société de la fiche à laquelle l''action est rattachée. Référence
        documentaire : raw.companies.id ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.dependsOn.data.id
      description: 'Identifiant de la fiche à laquelle l''action est rattachée. Le
        type de fiche est dans la colonne suivante. Référence documentaire : raw.contacts.id
        ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.dependsOn.data.type
      description: 'Type de la fiche rattachée : `contact`, `opportunity`, `company`…'
      data_type: LowCardinality(String)
    - name: attributes
      description: 'Attributs en JSON, dont `text` : le contenu de l''action (HTML).'
      data_type: String
  - name: companies
    description: Source physique en lecture seule ; toutes versions et colonnes conservées.
    columns:
