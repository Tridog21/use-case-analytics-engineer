      data_type: Nullable(Int64)
    - name: creationDate
      description: Date de création de la fiche.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: updateDate
      description: Date de la dernière modification.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: relationships.pole.data.id
      description: 'Pôle de la société (profil client cible). Référence documentaire
        : raw.poles.id ; intégrité temporelle à contrôler hors staging.'
      data_type: Nullable(Int64)
    - name: relationships.mainManager.data.id
      description: 'Responsable de l''enregistrement : le collaborateur qui le porte.
