      data_type: Nullable(Int64)
    - name: attributes
      description: 'Attributs en JSON : `subscriptionQuantityCharged` (licences facturées)
        et `subscriptionPriceExcludingTax` (prix unitaire mensuel).'
      data_type: String
- name: hubspot
  schema: '{{ var(''hubspot_source_schema'',''hubspot'') }}'
  description: Sources du case en lecture seule. Schéma de fixtures substituable dans
    une cible analytique isolée.
  tables:
  - name: contacts
    description: Source physique en lecture seule ; toutes versions et colonnes conservées.
    columns:
    - name: id
      description: Identifiant HubSpot du contact.
      data_type: String
    - name: properties_email
      description: Adresse e-mail.
      data_type: String
    - name: properties_createdate
      description: Date de création du contact dans HubSpot.
      data_type: Nullable(DateTime64(3,'UTC'))
    - name: properties_lifecyclestage
      description: 'Étape du cycle de vie HubSpot : subscriber, lead, opportunity,
        customer, other.'
      data_type: String
    - name: properties_hs_latest_source
      description: Dernière source de trafic connue (ORGANIC_SEARCH, PAID_SEARCH,
        PAID_SOCIAL, OFFLINE…).
      data_type: String
    - name: properties_utm_source
      description: Paramètre `utm_source` capté par le formulaire.
      data_type: String
    - name: properties_utm_campaign
      description: Paramètre `utm_campaign` capté par le formulaire.
      data_type: String
    - name: properties_first_conversion_event_name
      description: Nom du premier formulaire rempli.
      data_type: String
    - name: properties_first_conversion_date
      description: Date du premier formulaire rempli.
      data_type: Nullable(DateTime64(3,'UTC'))
