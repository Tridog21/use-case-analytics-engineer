version: 2
models:
- name: stg_boond_opportunities
  description: '**Couche/finalité** : staging technique, Besoins commerciaux (opportunités) : un besoin suit un
    prospect de la première demande jusqu''à la signature ou la perte. C''est l''objet que les commerciaux font
    avancer d''étape en étape. Reprise de toutes les 25 colonnes, sans sélection métier. Rafraîchissement manuel
    à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - capture
  columns:
  - name: src_tenant_id
    data_type: String
    description: Code du client Boond (tenant) dont vient la ligne. Un seul tenant dans ce jeu.
  - name: src_id
    data_type: Int64
    description: Identifiant de l'enregistrement dans Boond. Le même `id` revient à chaque version.
  - name: src_is_deleted
    data_type: Bool
    description: Vrai sur la version qui enregistre la suppression de l'enregistrement dans Boond.
  - name: src_published_at
    data_type: DateTime64(3,'UTC')
    description: 'Horodatage de la version : moment où la modification a été publiée par le flux CDC.'
  - name: src_state_id
    data_type: Nullable(Int64)
    description: 'Étape du besoin. Libellés et propriétés de chaque code dans le référentiel des étapes. Référence
      documentaire : raw.dictionaries.setting.state.opportunity ; intégrité temporelle à contrôler hors staging.'
  - name: src_type_id
    data_type: Nullable(Int64)
    description: 'Type de besoin : nouveau client, upsell, formation… Référence documentaire : raw.dictionaries.setting.typeOf.project
      ; intégrité temporelle à contrôler hors staging.'
  - name: src_title
    data_type: String
    description: Intitulé libre du besoin.
  - name: src_reference
    data_type: String
    description: Référence lisible générée par Boond à la création.
  - name: src_created_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Date de création du besoin dans Boond.
  - name: src_updated_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Date de la dernière modification de la fiche.
  - name: src_started_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Date de démarrage souhaitée par le prospect.
  - name: src_answer_due_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Date limite de réponse au prospect.
  - name: src_closing_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Date de closing saisie par le commercial sur la fiche.
  - name: src_estimated_amount_excluding_tax
    data_type: Nullable(Float64)
    description: Montant estimé du besoin, hors taxes, saisi par le commercial.
  - name: src_weighting_percent
    data_type: Nullable(Int64)
    description: Pondération du besoin en pourcentage.
  - name: src_weighted_amount_excluding_tax
    data_type: Nullable(Float64)
    description: 'Montant pondéré : montant estimé × pondération.'
  - name: src_exchange_rate
    data_type: Nullable(Float64)
    description: Taux de change entre la devise du besoin et celle de l'agence.
  - name: src_origin_type_id
    data_type: Nullable(Int64)
    description: 'Origine du besoin (canal par lequel il est arrivé). Référence documentaire : raw.dictionaries.setting.origin
      ; intégrité temporelle à contrôler hors staging.'
  - name: src_origin_detail
    data_type: String
    description: Précision libre sur l'origine.
  - name: src_main_manager_id
    data_type: Nullable(Int64)
    description: 'Responsable de l''enregistrement : le collaborateur qui le porte. Référence documentaire : raw.ressources.id
      ; intégrité temporelle à contrôler hors staging.'
  - name: src_created_by_id
    data_type: Nullable(Int64)
    description: 'Collaborateur (ou robot) qui a créé l''enregistrement. Référence documentaire : raw.ressources.id
      ; intégrité temporelle à contrôler hors staging.'
  - name: src_company_id
    data_type: Nullable(Int64)
    description: 'Société prospect ou cliente du besoin. Référence documentaire : raw.companies.id ; intégrité temporelle
      à contrôler hors staging.'
  - name: src_contact_id
    data_type: Nullable(Int64)
    description: 'Contact principal du besoin. Référence documentaire : raw.contacts.id ; intégrité temporelle à
      contrôler hors staging.'
  - name: src_agency_id
    data_type: Nullable(Int64)
    description: 'Agence Boond qui porte le besoin. Référence documentaire : raw.agencies.id ; intégrité temporelle
      à contrôler hors staging.'
  - name: src_attributes
    data_type: String
    description: 'Attributs complémentaires en JSON, dont `stateReason` : la raison de perte choisie dans la liste
      de l''étape.'
  - name: source_identity_key
    data_type: String
    description: Identité qualifiée de la source, tenant et clé source sérialisés.
  - name: source_payload_hash
    data_type: String
    description: Empreinte typée ordonnée des colonnes source, NULL distinct de vide.
  - name: source_version_key
    data_type: String
    description: Identité de version CDC ou de changement de capture.
  - name: imported_at
    data_type: DateTime64(3,'UTC')
    description: Instant technique du premier import, figé à la tentative.
  - name: capture_key
    data_type: String
    description: Identifiant durable de la tentative source.
  - name: capture_at
    data_type: DateTime64(3,'UTC')
    description: Instant figé de la lecture complète source.
  - name: is_source_present
    data_type: Bool
    description: Présence technique ; false seulement après une capture complète validée.
  data_tests:
  - case_grain:
      arguments:
        key: source_version_key
        run_scoped: false
      config:
        tags: *id001
- name: stg_boond_actions
  description: '**Couche/finalité** : staging technique, Actions du CRM : appels, demandes de démo, démos, rendez-vous,
    notes. Une action est rattachée à une fiche (le plus souvent un contact) et porte une date dans l''agenda. Reprise
