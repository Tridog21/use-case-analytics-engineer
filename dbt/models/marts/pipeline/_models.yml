- name: fct_opportunity_event
  description: '**Grain métier :** Opportunité × événement distinct et rôle de contribution. **Clé :** event_key
    ; record_key=H(tuple du grain), identique à la clé hashée amont. **Grain de révision :** (model_run_id,record_key).
