- name: fct_action
  description: '**Grain métier :** Action × intervalle de version/contexte ; action_key est l’identité stable. **Clé
    :** action_version_key ; record_key=H(tuple du grain), identique à la clé hashée amont. **Grain de révision
    :** (model_run_id,record_key). Rafraîchissement manuel à la demande. Histoire et révisions conservées ; publication
    contrôlée.'
  config:
    tags: &id005
    - mart
  columns:
  - name: model_run_id
    data_type: String
    description: 'Métadonnée amont int_actions_prepared.model_run_id ; row_hash recalculé sur le contrat final du
      fait si des colonnes techniques sont ajoutées. Empreinte SHA256 commune de la recomposition : manifeste des
      entrées figées, code, référentiels et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Métadonnée amont int_actions_prepared.record_key ; row_hash recalculé sur le contrat final du fait
      si des colonnes techniques sont ajoutées. Identité String H(tuple du grain décrit, domaine/version explicite),
      sans model_run_id ; égale la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date),
      jamais date_key UInt32 brut.
  - name: record_version_key
    data_type: String
    description: Métadonnée amont int_actions_prepared.record_version_key ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. H(model_run_id,record_key) ; unicité physique de la révision
      du modèle.
  - name: row_hash
    data_type: String
    description: Métadonnée amont int_actions_prepared.row_hash ; row_hash recalculé sur le contrat final du fait
      si des colonnes techniques sont ajoutées. H(tuple ordonné de toutes les colonnes métier de la fiche, NULL
      et types préservés) ; exclut les métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_actions_prepared.calculated_at ; row_hash recalculé sur le contrat final du
      fait si des colonnes techniques sont ajoutées. Instant de calcul du lot ; fixe pour un même model_run_id,
      jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Métadonnée amont int_actions_prepared.rule_version ; row_hash recalculé sur le contrat final du
      fait si des colonnes techniques sont ajoutées. Empreinte immuable du code et des règles appliquées ; dérivée
      du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_actions_prepared.input_cutoff_at ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Date limite de connaissance de la recomposition ; les entrées
      exactes sont figées par le manifeste, pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Métadonnée amont int_actions_prepared.source_published_at ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Maximum de publication CDC des versions contribuant à la
      ligne ; NULL pour un référentiel exclusivement généré. Les entrées de règles non fournies proviennent du futur
      dbt/config/case_rules.yml fusionné dans vars, sans seed ou source implicite. Ce maximum ne remplace aucune
      date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Métadonnée amont int_actions_prepared.source_version_keys ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Clés des versions sources contributrices, triées et sans
      répétition ; union des lignages amont. Liste vide pour une ligne exclusivement générée.
  - name: action_key
    data_type: String
    description: Projection explicite de int_actions_prepared.action_key ; H(tenant_id,action_id), identité stable.
  - name: action_version_key
    data_type: String
    description: Projection explicite de int_actions_prepared.action_version_key ; H(action_key,valid_from_at),
      grain de version.
  - name: tenant_id
    data_type: String
    description: Projection explicite de int_actions_prepared.tenant_id ; src_tenant_id.
  - name: action_id
    data_type: Int64
    description: Projection explicite de int_actions_prepared.action_id ; src_id.
  - name: valid_from_at
    data_type: DateTime64(3,'UTC')
    description: Projection explicite de int_actions_prepared.valid_from_at ; Publication CDC et bornes de contexte
      incluses.
  - name: valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_actions_prepared.valid_to_at ; Version/context suivant exclu.
  - name: source_action_published_at
    data_type: DateTime64(3,'UTC')
    description: Projection explicite de int_actions_prepared.source_action_published_at ; Publication CDC exacte
      de l’action, sans max des autres objets de contexte.
  - name: is_source_deleted
    data_type: Bool
    description: Projection explicite de int_actions_prepared.is_source_deleted ; src_is_deleted.
  - name: action_type_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_actions_prepared.action_type_id ; src_type_id.
  - name: action_type_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.action_type_key ; Identité type.
  - name: action_type_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.action_type_version_key ; Version dim_action_type.
  - name: company_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_actions_prepared.company_id ; src_company_id ; pas complétion ambiguë.
  - name: company_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.company_key ; Identité société.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.company_version_key ; Version société à date.
  - name: contact_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_actions_prepared.contact_id ; dependsOn.id si type=contact.
  - name: opportunity_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_actions_prepared.opportunity_id ; dependsOn.id si type=opportunity
      ; NULL si seul contact.
  - name: opportunity_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.opportunity_key ; Besoin seulement si lien direct
      établi.
  - name: depends_on_type
    data_type: String
    description: Projection explicite de int_actions_prepared.depends_on_type ; src_depends_on_type.
  - name: depends_on_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_actions_prepared.depends_on_id ; src_depends_on_id, lu avec type.
  - name: employee_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_actions_prepared.employee_id ; src_main_manager_id.
  - name: employee_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.employee_key ; Identité responsable.
  - name: employee_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.employee_version_key ; Version responsable.
  - name: team_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.team_key ; Équipe si règle action et mapping explicites
      ; NULL sinon.
  - name: team_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.team_version_key ; Version équipe.
  - name: is_team_calculable
    data_type: Bool
    description: Projection explicite de int_actions_prepared.is_team_calculable ; Attribution action résolue et
      univoque.
  - name: created_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_actions_prepared.created_at ; src_created_at.
  - name: scheduled_start_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_actions_prepared.scheduled_start_at ; src_started_at, agenda uniquement.
  - name: scheduled_end_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_actions_prepared.scheduled_end_at ; src_ended_at, agenda uniquement.
  - name: actual_event_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_actions_prepared.actual_event_at ; NULL sans preuve structurée de tenue.
  - name: realization_status
    data_type: String
    description: Projection explicite de int_actions_prepared.realization_status ; unknown sans preuve ; held/planned/cancelled/no_show
      seulement si prouvé.
  - name: is_demo_request
    data_type: Bool
    description: Projection explicite de int_actions_prepared.is_demo_request ; Type25 selon mapping, sans compter
      les versions.
  - name: is_demo_type
    data_type: Bool
    description: Projection explicite de int_actions_prepared.is_demo_type ; Type60/68 selon mapping documentaire.
  - name: is_realized_demo
    data_type: Nullable(Bool)
