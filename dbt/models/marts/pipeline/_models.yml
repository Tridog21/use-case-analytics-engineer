      passé ne suffit pas.
  - name: demo_session_key
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.demo_session_key ; Séance réelle dédupliquée, NULL
      sans règle/proof.
  - name: counting_date
    data_type: Nullable(Date)
    description: Projection explicite de int_actions_prepared.counting_date ; Date Paris tenue réelle, NULL sans
      preuve.
  - name: link_status
    data_type: String
    description: Projection explicite de int_actions_prepared.link_status ; direct_opportunity / contact_only /
      missing / ambiguous.
  - name: calculation_status
    data_type: String
    description: Projection explicite de int_actions_prepared.calculation_status ; ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection explicite de int_actions_prepared.status_reason ; Cause précise stable ; NULL si aucune
      dépendance manquante.
  - name: created_date_key
    data_type: Nullable(UInt32)
    description: Date Paris création action.
  - name: scheduled_start_date_key
    data_type: Nullable(UInt32)
    description: Date Paris agenda.
  - name: actual_event_date_key
    data_type: Nullable(UInt32)
    description: Date Paris tenue prouvée, NULL sans preuve.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id005
