version: 2
models:
- name: fct_opportunity_period
  description: '**Grain métier :** Opportunité × intervalle de contexte stable. **Clé :** period_key ; record_key=H(tuple
    du grain), identique à la clé hashée amont. **Grain de révision :** (model_run_id,record_key). Rafraîchissement
    manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - mart
  columns:
  - name: model_run_id
    data_type: String
    description: 'Métadonnée amont int_opportunity_periods.model_run_id ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Empreinte SHA256 commune de la recomposition : manifeste
      des entrées figées, code, référentiels et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Métadonnée amont int_opportunity_periods.record_key ; row_hash recalculé sur le contrat final du
      fait si des colonnes techniques sont ajoutées. Identité String H(tuple du grain décrit, domaine/version explicite),
      sans model_run_id ; égale la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date),
      jamais date_key UInt32 brut.
  - name: record_version_key
    data_type: String
    description: Métadonnée amont int_opportunity_periods.record_version_key ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. H(model_run_id,record_key) ; unicité physique de la
      révision du modèle.
  - name: row_hash
    data_type: String
    description: Métadonnée amont int_opportunity_periods.row_hash ; row_hash recalculé sur le contrat final du
      fait si des colonnes techniques sont ajoutées. H(tuple ordonné de toutes les colonnes métier de la fiche,
      NULL et types préservés) ; exclut les métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_opportunity_periods.calculated_at ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Instant de calcul du lot ; fixe pour un même model_run_id,
      jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Métadonnée amont int_opportunity_periods.rule_version ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Empreinte immuable du code et des règles appliquées ; dérivée
      du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_opportunity_periods.input_cutoff_at ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Date limite de connaissance de la recomposition ; les entrées
      exactes sont figées par le manifeste, pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Métadonnée amont int_opportunity_periods.source_published_at ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Maximum de publication CDC des versions contribuant
      à la ligne ; NULL pour un référentiel exclusivement généré. Les entrées de règles non fournies proviennent
      du futur dbt/config/case_rules.yml fusionné dans vars, sans seed ou source implicite. Ce maximum ne remplace
      aucune date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Métadonnée amont int_opportunity_periods.source_version_keys ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Clés des versions sources contributrices, triées et
      sans répétition ; union des lignages amont. Liste vide pour une ligne exclusivement générée.
  - name: tenant_id
    data_type: String
    description: Projection explicite de int_opportunity_periods.tenant_id ; Identité du tenant src_tenant_id.
  - name: opportunity_id
    data_type: Int64
    description: Projection explicite de int_opportunity_periods.opportunity_id ; src_id du besoin Boond.
  - name: opportunity_key
    data_type: String
    description: Projection explicite de int_opportunity_periods.opportunity_key ; H(tenant_id,opportunity_id),
      identité stable intermodèles.
  - name: period_key
    data_type: String
    description: Projection explicite de int_opportunity_periods.period_key ; H(opportunity_key,valid_from_at).
  - name: visit_key
    data_type: String
    description: Projection explicite de int_opportunity_periods.visit_key ; Passage courant.
  - name: valid_from_at
    data_type: DateTime64(3,'UTC')
    description: Projection explicite de int_opportunity_periods.valid_from_at ; Borne CDC/contexte incluse.
  - name: valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_periods.valid_to_at ; Borne suivante exclue.
  - name: is_source_deleted
    data_type: Bool
    description: Projection explicite de int_opportunity_periods.is_source_deleted ; src_is_deleted, sélection des
      versions avant exclusion.
  - name: created_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_periods.created_at ; src_created_at ; pas antidatation
      de l’état.
  - name: cohort_month
    data_type: Nullable(Date)
    description: Projection explicite de int_opportunity_periods.cohort_month ; Mois de création Paris.
  - name: stage_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_periods.stage_id ; État source.
  - name: stage_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.stage_key ; Identité étape.
  - name: stage_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.stage_version_key ; Version dim_stage valable sur
      toute tranche.
  - name: outcome_category
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.outcome_category ; Classe analytique, NULL si code
      non mappé.
  - name: is_open
    data_type: Nullable(Bool)
    description: Projection explicite de int_opportunity_periods.is_open ; Classe open ; suppression et inconnu
      distincts.
  - name: company_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_periods.company_id ; Société Boond au moment de référence.
  - name: company_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.company_key ; H(tenant_id,company_id) si société
      connue.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.company_version_key ; Version dim_company à la
      date de référence ; jointure sur même run.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_periods.sale_type_id ; Type commercial de la version du
      besoin.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.sale_type_key ; Identité stable du code type.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.sale_type_version_key ; Version dim_sale_type au
      moment de référence.
  - name: employee_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_periods.employee_id ; Responsable principal Boond à la
      date pertinente.
  - name: employee_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.employee_key ; Identité stable du responsable.
  - name: employee_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.employee_version_key ; Version de dim_employee
      à la date pertinente.
  - name: team_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_periods.team_id ; Équipe businessunit seulement si attribution
      univoque.
  - name: team_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.team_key ; Identité stable d’équipe ; NULL si ambiguë
      ou inconnue.
  - name: team_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.team_version_key ; Version dim_team pertinente
      à la date.
  - name: sales_segment
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.sales_segment ; SMB / LA / ES si mapping fourni
      ; NULL sinon.
  - name: is_team_calculable
    data_type: Bool
    description: Projection explicite de int_opportunity_periods.is_team_calculable ; Vrai si une seule équipe est
      historiquement résolue ; KAM reste connue même sans segment de cible D23.
  - name: acquisition_channel_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.acquisition_channel_key ; Canal officiel fixé à
      création ; NULL avant règle QM-02.
  - name: channel_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.channel_version_key ; Version de dim_channel applicable
      à l’acquisition.
  - name: channel_candidate_code
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.channel_candidate_code ; Code origine Boond à création,
      converti String ; candidat descriptif seulement.
  - name: is_channel_calculable
    data_type: Bool
    description: Projection explicite de int_opportunity_periods.is_channel_calculable ; Vrai seulement si règle
      canal et mapping appliqués sans ambiguïté.
  - name: attribution_status
    data_type: String
    description: Projection explicite de int_opportunity_periods.attribution_status ; resolved / missing_team_mapping
      / multiple_teams / missing_channel_rule ; détails conservés.
  - name: pipeline_amount
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_opportunity_periods.pipeline_amount ; src_estimated_amount_excluding_tax
      converti chaîne→Decimal(38,4), sans mensualisation.
  - name: amount_basis
    data_type: String
    description: Projection explicite de int_opportunity_periods.amount_basis ; crm_estimated_unconfirmed tant que
      nature inconnue.
  - name: currency_code
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.currency_code ; EUR par hypothèse explicite du
      case D20 ; cette devise ne prouve ni mensualité ni engagement du montant commercial.
  - name: source_weighting_percent
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_periods.source_weighting_percent ; src_weighting_percent
      descriptif.
  - name: source_weighted_amount
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_opportunity_periods.source_weighted_amount ; src_weighted_amount_excluding_tax
      descriptif.
  - name: signature_probability
    data_type: Nullable(Decimal(18,8))
    description: Projection explicite de int_opportunity_periods.signature_probability ; Coefficient de ref.stage_probabilities
      choisi selon D21 ; NULL seulement si état/segment non couvert, pas de fallback Boond.
  - name: probability_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.probability_version_key ; Version ref si utilisée.
  - name: weighted_pipeline_amount
    data_type: Nullable(Decimal(38,4))
    description: 'Projection explicite de int_opportunity_periods.weighted_pipeline_amount ; Produit intermédiaire
      Decimal(38,12) à proba Decimal(18,8), contrôle dépassement et égalité exacte au cast retour depuis Decimal(38,4).
      Aucune perte d’échelle admise : sinon résultat NULL, insufficient_decimal_scale et publication de cette mesure
      bloquée jusqu’à migration de précision. Aucun arrondi intermédiaire ni double pondération.'
  - name: expected_close_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_periods.expected_close_at ; src_closing_at saisi, pas signature
      réelle.
  - name: stage_entered_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_periods.stage_entered_at ; entered_at passage, NULL si
      censuré.
  - name: stage_first_observed_at
    data_type: DateTime64(3,'UTC')
    description: Projection explicite de int_opportunity_periods.stage_first_observed_at ; Présence observée dans
      passage.
  - name: stagnation_threshold_days
    data_type: Nullable(Float64)
    description: Projection explicite de int_opportunity_periods.stagnation_threshold_days ; 21jours continus par
      défaut, dépassement strict>, paramétrable par étape/type D26 ; NULL uniquement si alerte explicitement désactivée.
  - name: stagnant_from_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_periods.stagnant_from_at ; Début passage + seuil en jours
      continus si connus.
  - name: is_pipeline_eligible
    data_type: Nullable(Bool)
    description: Projection explicite de int_opportunity_periods.is_pipeline_eligible ; true pour type4/7 et état
      ouvert D22/D30 ; false si explicitement hors population ; NULL si type/état source inconnu.
  - name: source_opportunity_version_key
    data_type: String
    description: Projection explicite de int_opportunity_periods.source_opportunity_version_key ; Version source
      portant attributs.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_periods.coverage_start_at ; Début déclaré.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_periods.coverage_end_at ; Fin déclarée.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Projection explicite de int_opportunity_periods.is_history_complete ; Complétude déclarée de la
      fenêtre.
  - name: calculation_status
    data_type: String
    description: Projection explicite de int_opportunity_periods.calculation_status ; ready / partial / blocked
      / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_periods.status_reason ; Cause précise stable ; NULL si
      aucune dépendance manquante.
  - name: created_date_key
    data_type: Nullable(UInt32)
    description: Date Paris created_at ; NULL si inconnue.
  - name: period_start_date_key
    data_type: UInt32
    description: Date Paris valid_from_at.
  - name: expected_closing_date_key
    data_type: Nullable(UInt32)
    description: Date Paris expected_close_at si dans calendrier ; date de prévision, pas signature.
  - name: stage_entered_date_key
    data_type: Nullable(UInt32)
    description: Date Paris stage_entered_at, NULL censurée.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id001
- name: fct_stage_visit
  description: '**Grain métier :** Opportunité × passage continu dans une étape. **Clé :** visit_key ; record_key=H(tuple
    du grain), identique à la clé hashée amont. **Grain de révision :** (model_run_id,record_key). Rafraîchissement
    manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id002
    - mart
  columns:
  - name: model_run_id
    data_type: String
    description: 'Métadonnée amont int_opportunity_stage_visits.model_run_id ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Empreinte SHA256 commune de la recomposition : manifeste
      des entrées figées, code, référentiels et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Métadonnée amont int_opportunity_stage_visits.record_key ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Identité String H(tuple du grain décrit, domaine/version
      explicite), sans model_run_id ; égale la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise
      H(calendar_date), jamais date_key UInt32 brut.
  - name: record_version_key
    data_type: String
    description: Métadonnée amont int_opportunity_stage_visits.record_version_key ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. H(model_run_id,record_key) ; unicité physique de la
      révision du modèle.
  - name: row_hash
    data_type: String
    description: Métadonnée amont int_opportunity_stage_visits.row_hash ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. H(tuple ordonné de toutes les colonnes métier de la fiche,
      NULL et types préservés) ; exclut les métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_opportunity_stage_visits.calculated_at ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Instant de calcul du lot ; fixe pour un même model_run_id,
      jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Métadonnée amont int_opportunity_stage_visits.rule_version ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Empreinte immuable du code et des règles appliquées
      ; dérivée du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_opportunity_stage_visits.input_cutoff_at ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Date limite de connaissance de la recomposition ;
      les entrées exactes sont figées par le manifeste, pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Métadonnée amont int_opportunity_stage_visits.source_published_at ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Maximum de publication CDC des versions contribuant
      à la ligne ; NULL pour un référentiel exclusivement généré. Les entrées de règles non fournies proviennent
      du futur dbt/config/case_rules.yml fusionné dans vars, sans seed ou source implicite. Ce maximum ne remplace
      aucune date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Métadonnée amont int_opportunity_stage_visits.source_version_keys ; row_hash recalculé sur le contrat
      final du fait si des colonnes techniques sont ajoutées. Clés des versions sources contributrices, triées et
      sans répétition ; union des lignages amont. Liste vide pour une ligne exclusivement générée.
  - name: tenant_id
    data_type: String
    description: Projection explicite de int_opportunity_stage_visits.tenant_id ; Identité du tenant src_tenant_id.
  - name: opportunity_id
    data_type: Int64
    description: Projection explicite de int_opportunity_stage_visits.opportunity_id ; src_id du besoin Boond.
  - name: opportunity_key
    data_type: String
    description: Projection explicite de int_opportunity_stage_visits.opportunity_key ; H(tenant_id,opportunity_id),
      identité stable intermodèles.
  - name: visit_key
    data_type: String
    description: Projection explicite de int_opportunity_stage_visits.visit_key ; H(opportunity_key,first_observed_at,first_source_version_key).
  - name: stage_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_stage_visits.stage_id ; src_state_id du groupe consécutif.
  - name: visit_rank
    data_type: UInt32
    description: Projection explicite de int_opportunity_stage_visits.visit_rank ; Rang chronologique, jamais ordre
      des codes.
  - name: first_observed_at
    data_type: DateTime64(3,'UTC')
    description: Projection explicite de int_opportunity_stage_visits.first_observed_at ; Première publication prouvant
      présence dans cet état.
  - name: last_observed_at
    data_type: DateTime64(3,'UTC')
    description: Projection explicite de int_opportunity_stage_visits.last_observed_at ; Dernière publication du
      même passage.
  - name: entered_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_stage_visits.entered_at ; Entrée datée ou proxy CDC d’une
      transition observée ; NULL premier état avancé censuré.
  - name: exited_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_stage_visits.exited_at ; Transition suivante observée ;
      NULL en cours/suppression sans sortie métier.
  - name: observation_ended_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_stage_visits.observation_ended_at ; Fin technique d’observation,
      distincte de exited_at.
  - name: previous_stage_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_stage_visits.previous_stage_id ; État précédent observé
      hors lacune.
  - name: next_stage_id
    data_type: Nullable(Int64)
    description: Projection explicite de int_opportunity_stage_visits.next_stage_id ; État suivant observé hors
      lacune.
  - name: first_source_version_key
    data_type: String
    description: Projection explicite de int_opportunity_stage_visits.first_source_version_key ; Version source
      initiale du groupe.
  - name: last_source_version_key
    data_type: String
    description: Projection explicite de int_opportunity_stage_visits.last_source_version_key ; Version source finale
      du groupe.
  - name: event_time_basis
    data_type: String
    description: Projection explicite de int_opportunity_stage_visits.event_time_basis ; cdc_transition_proxy /
      business_proven / left_censored / observation_only.
  - name: is_left_censored
    data_type: Bool
    description: Projection explicite de int_opportunity_stage_visits.is_left_censored ; Début du passage non observable.
  - name: is_right_censored
    data_type: Bool
    description: Projection explicite de int_opportunity_stage_visits.is_right_censored ; Sortie admissible non
      observée.
  - name: is_open_visit
    data_type: Bool
    description: Projection explicite de int_opportunity_stage_visits.is_open_visit ; Pas de transition/suppression
      suivante ; différent d’étape commercialement ouverte.
  - name: has_observation_gap
    data_type: Bool
    description: Projection explicite de int_opportunity_stage_visits.has_observation_gap ; Lacune ou suppression/réapparition
      séparant passages.
  - name: completed_duration_seconds
    data_type: Nullable(Float64)
    description: Projection explicite de int_opportunity_stage_visits.completed_duration_seconds ; Différence millisecondes
      UTC/1000 pour passage terminé avec début admissible ; NULL sinon.
  - name: completed_duration_days
    data_type: Nullable(Float64)
    description: Projection explicite de int_opportunity_stage_visits.completed_duration_days ; completed_duration_seconds/86400.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_stage_visits.coverage_start_at ; Couverture déclarée ;
      première observation seule ne prouve pas exhaustivité.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Projection explicite de int_opportunity_stage_visits.coverage_end_at ; Fin déclarée ; jamais max(updateDate)
      futur.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Projection explicite de int_opportunity_stage_visits.is_history_complete ; Couverture de fenêtre
      vérifiée/configurée ; NULL si non établie.
  - name: calculation_status
    data_type: String
    description: Projection explicite de int_opportunity_stage_visits.calculation_status ; ready / partial / blocked
      / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection explicite de int_opportunity_stage_visits.status_reason ; Cause précise stable ; NULL
      si aucune dépendance manquante.
  - name: stage_key
    data_type: Nullable(String)
    description: Identité de l’étape.
  - name: stage_version_key
    data_type: Nullable(String)
    description: Version dim_stage à first_observed_at ; libellé d’observation, pas état courant réappliqué.
  - name: company_id
    data_type: Nullable(Int64)
    description: Société au contexte d’entrée si connu, sinon première observation avec réserve explicite.
  - name: company_key
