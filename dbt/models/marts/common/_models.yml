    data_type: Bool
    description: Dernière valeur src_is_deleted de cette version ; suppression technique, pas issue métier.
  - name: company_name
    data_type: String
    description: src_name ; chaîne source conservée.
  - name: company_state_id
    data_type: Nullable(Int64)
    description: src_state_id ; ne définit pas l’activité des abonnements.
  - name: source_country_code
    data_type: String
    description: src_country.
  - name: country_key
    data_type: Nullable(String)
    description: Clé dim_country, même run ; NULL si absence de mapping.
  - name: staff
    data_type: Nullable(Int64)
    description: src_staff ; pas de tranche d’effectif inventée.
  - name: pole_id
    data_type: Nullable(Int64)
    description: src_pole_id.
  - name: pole_label
    data_type: Nullable(String)
    description: src_name de stg_boond_poles dans la version temporelle correspondante.
  - name: main_manager_id
    data_type: Nullable(Int64)
    description: src_main_manager_id conservé à titre de contexte.
  - name: agency_id
    data_type: Nullable(Int64)
    description: src_agency_id ; aucune équipe déduite.
  - name: created_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: src_created_at, distinct de valid_from_at.
