version: 2
models:
- name: dim_date
  description: '**Grain métier :** Jour civil du calendrier Europe/Paris. **Grain physique :** `(model_run_id, record_key)`.
    **Clé du grain :** `date_key` identifie le jour ; `record_key=H(calendar_date)` respecte son type String. Rafraîchissement
    manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - common
  columns:
  - name: model_run_id
    data_type: String
    description: 'Empreinte SHA256 commune de la recomposition : manifeste des entrées figées, code, référentiels
      et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Identité String H(tuple du grain décrit, domaine/version explicite), sans model_run_id ; égale
      la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date), jamais date_key
      UInt32 brut.
  - name: record_version_key
    data_type: String
    description: H(model_run_id,record_key) ; unicité physique de la révision du modèle.
  - name: row_hash
    data_type: String
    description: H(tuple ordonné de toutes les colonnes métier de la fiche, NULL et types préservés) ; exclut les
      métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Instant de calcul du lot ; fixe pour un même model_run_id, jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Empreinte immuable du code et des règles appliquées ; dérivée du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Date limite de connaissance de la recomposition ; les entrées exactes sont figées par le manifeste,
      pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Maximum de publication CDC des versions contribuant à la ligne ; NULL pour un référentiel exclusivement
      généré. Les entrées de règles non fournies proviennent du futur dbt/config/case_rules.yml fusionné dans vars,
      sans seed ou source implicite. Ce maximum ne remplace aucune date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Clés des versions sources contributrices, triées et sans répétition ; union des lignages amont.
      Liste vide pour une ligne exclusivement générée.
  - name: date_key
    data_type: UInt32
    description: YYYYMMDD de calendar_date ; clé de date UInt32. record_key=H(calendar_date), String.
  - name: calendar_date
    data_type: Date
    description: Jour civil généré.
  - name: day_started_at
    data_type: DateTime64(3,'UTC')
    description: Minuit Europe/Paris converti en UTC ; tient compte des changements d’heure.
  - name: next_day_started_at
    data_type: DateTime64(3,'UTC')
    description: Minuit local suivant converti en UTC ; intervalle [jour,jour suivant).
  - name: week_started_date
    data_type: Date
    description: Lundi de la semaine ISO.
  - name: iso_year
    data_type: UInt16
    description: Année ISO de la semaine.
  - name: iso_week
    data_type: UInt8
    description: Semaine ISO 1–53.
  - name: month_date
    data_type: Date
    description: Premier jour du mois civil.
  - name: month_end_date
    data_type: Date
    description: Dernier jour du mois civil.
  - name: next_month_started_at
    data_type: DateTime64(3,'UTC')
    description: Premier jour du mois suivant à minuit Paris, converti UTC ; borne exclusive de clôture.
  - name: year
    data_type: UInt16
    description: Année civile.
  - name: quarter
    data_type: UInt8
    description: Trimestre 1–4.
  - name: day_of_week
    data_type: UInt8
    description: Lundi=1 … dimanche=7.
  - name: is_week_end
    data_type: Bool
    description: day_of_week dans 6/7 ; descriptif, aucune exclusion des durées.
  - name: is_month_end
    data_type: Bool
    description: calendar_date=month_end_date.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id001
