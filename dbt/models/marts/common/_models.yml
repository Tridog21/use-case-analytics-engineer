    data_type: String
    description: H(tenant_id,stage_id) ; identité stable du code.
  - name: stage_version_key
    data_type: String
    description: H(stage_key,language,valid_from_at).
  - name: tenant_id
    data_type: String
    description: src_tenant_id.
  - name: stage_id
    data_type: Int64
    description: JSON.id du tableau src_setting_state_opportunity_json.
  - name: stage_label
    data_type: String
    description: JSON.value, libellé source.
  - name: language
    data_type: String
    description: fr retenu pour la restitution ; autres langues préservées dans le staging.
  - name: valid_from_at
    data_type: DateTime64(3,'UTC')
    description: Publication de la version dictionnaire contenant le code, incluse.
  - name: valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Publication dictionnaire suivante exclue, même si le code disparaît alors.
  - name: is_source_json_present
    data_type: Bool
    description: Champ JSON source non NULL ; absence ne devient pas tableau vide connu.
  - name: is_source_json_valid
    data_type: Bool
    description: JSON syntaxiquement valide et de forme tableau ; faux/absence bloque les mesures dépendantes.
  - name: is_source_deleted
    data_type: Bool
    description: Suppression de la version dictionnaire ; aucun code courant recréé après sa suppression.
  - name: documented_active
    data_type: Nullable(Bool)
    description: JSON.active ; propriété documentaire « en cours », distincte de l’éligibilité aux KPI.
  - name: is_enabled_in_source
    data_type: Nullable(Bool)
    description: JSON.isEnabled ; un code désactivé dans l’interface reste dans l’histoire.
  - name: documented_weighting_percent
    data_type: Nullable(Int64)
    description: JSON.weighting, descriptif ; aucune seconde pondération.
  - name: state_reasons_json
    data_type: Nullable(String)
    description: JSON.reason sérialisé, conservé sans en faire un KPI.
  - name: outcome_category
