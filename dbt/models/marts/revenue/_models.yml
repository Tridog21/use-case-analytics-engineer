    description: Projection explicite de int_subscription_month_end.candidate_active_mrr ; Montant ligne actif ;0
      si inactif prouvé ;NULL si inconnu.
  - name: sum_active_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_subscription_month_end.sum_active_mrr ; Somme officielle des lignes
      admissibles en EUR sous hypothèses D16/D20 ;NULL si activité/montant ou inventaire requis inconnus, sans prorata.
  - name: currency_code
    data_type: Nullable(String)
    description: Projection explicite de int_subscription_month_end.currency_code ; EUR par hypothèse explicite
      du case D20 ; cette devise ne prouve ni mensualité ni engagement du montant commercial.
