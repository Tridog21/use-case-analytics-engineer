version: 2
models:
- name: fct_mrr_movement
  description: '**Grain métier :** Société × mois × composante nette de variation. **Clé :** movement_contribution_key
    ; record_key=H(tuple du grain), identique à la clé hashée amont. **Grain de révision :** (model_run_id,record_key).
    Rafraîchissement manuel à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - mart
  columns:
  - name: model_run_id
    data_type: String
    description: 'Métadonnée amont int_mrr_movements.model_run_id ; row_hash recalculé sur le contrat final du fait
      si des colonnes techniques sont ajoutées. Empreinte SHA256 commune de la recomposition : manifeste des entrées
      figées, code, référentiels et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Métadonnée amont int_mrr_movements.record_key ; row_hash recalculé sur le contrat final du fait
      si des colonnes techniques sont ajoutées. Identité String H(tuple du grain décrit, domaine/version explicite),
      sans model_run_id ; égale la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date),
      jamais date_key UInt32 brut.
  - name: record_version_key
    data_type: String
    description: Métadonnée amont int_mrr_movements.record_version_key ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. H(model_run_id,record_key) ; unicité physique de la révision
      du modèle.
  - name: row_hash
    data_type: String
    description: Métadonnée amont int_mrr_movements.row_hash ; row_hash recalculé sur le contrat final du fait si
      des colonnes techniques sont ajoutées. H(tuple ordonné de toutes les colonnes métier de la fiche, NULL et
      types préservés) ; exclut les métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_mrr_movements.calculated_at ; row_hash recalculé sur le contrat final du fait
      si des colonnes techniques sont ajoutées. Instant de calcul du lot ; fixe pour un même model_run_id, jamais
      utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Métadonnée amont int_mrr_movements.rule_version ; row_hash recalculé sur le contrat final du fait
      si des colonnes techniques sont ajoutées. Empreinte immuable du code et des règles appliquées ; dérivée du
      manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Métadonnée amont int_mrr_movements.input_cutoff_at ; row_hash recalculé sur le contrat final du
      fait si des colonnes techniques sont ajoutées. Date limite de connaissance de la recomposition ; les entrées
      exactes sont figées par le manifeste, pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Métadonnée amont int_mrr_movements.source_published_at ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Maximum de publication CDC des versions contribuant à la
      ligne ; NULL pour un référentiel exclusivement généré. Les entrées de règles non fournies proviennent du futur
      dbt/config/case_rules.yml fusionné dans vars, sans seed ou source implicite. Ce maximum ne remplace aucune
      date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Métadonnée amont int_mrr_movements.source_version_keys ; row_hash recalculé sur le contrat final
      du fait si des colonnes techniques sont ajoutées. Clés des versions sources contributrices, triées et sans
      répétition ; union des lignages amont. Liste vide pour une ligne exclusivement générée.
  - name: movement_contribution_key
    data_type: String
    description: Projection explicite de int_mrr_movements.movement_contribution_key ; H(company_key,month_date,movement_kind).
  - name: tenant_id
    data_type: String
    description: Projection explicite de int_mrr_movements.tenant_id ; Tenant.
  - name: client_context_key
    data_type: String
    description: Projection explicite de int_mrr_movements.client_context_key ; Contexte société/mois.
  - name: company_id
    data_type: Int64
    description: Projection explicite de int_mrr_movements.company_id ; ID société.
  - name: company_key
    data_type: String
    description: Projection explicite de int_mrr_movements.company_key ; Identité société.
  - name: company_version_key
    data_type: Nullable(String)
    description: Projection explicite de int_mrr_movements.company_version_key ; Version à clôture.
  - name: month_date
    data_type: Date
    description: Projection explicite de int_mrr_movements.month_date ; Mois.
  - name: month_end_date
    data_type: Date
    description: Projection explicite de int_mrr_movements.month_end_date ; Clôture courante.
  - name: previous_month_end_date
    data_type: Date
    description: Projection explicite de int_mrr_movements.previous_month_end_date ; Clôture précédente.
  - name: movement_kind
    data_type: String
    description: Projection explicite de int_mrr_movements.movement_kind ; new / upsell / departure / contraction
      / stable / unknown.
  - name: new_mrr_component
    data_type: Nullable(String)
    description: Projection explicite de int_mrr_movements.new_mrr_component ; New entrants/retours ;Upsell hausse
      restants ;NULL autres.
  - name: sum_new_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_mrr_movements.sum_new_mrr ; MRR après entrant ;max(après−avant,0) hausse
      restant ;NULL noncomparable. Aucune ligne total en plus.
  - name: sum_departure_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_mrr_movements.sum_departure_mrr ; MRR avant sortant ;0 autres cas comparables.
  - name: sum_contraction_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_mrr_movements.sum_contraction_mrr ; max(avant−après,0) restant baisse
      ;0 autres cas comparables.
  - name: sum_candidate_new_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_mrr_movements.sum_candidate_new_mrr ; Mêmeformule sur candidats,diagnostic
      devise inconnue.
  - name: sum_candidate_departure_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_mrr_movements.sum_candidate_departure_mrr ; Départs candidats.
  - name: sum_candidate_contraction_mrr
    data_type: Nullable(Decimal(38,4))
    description: Projection explicite de int_mrr_movements.sum_candidate_contraction_mrr ; Baisses candidates.
  - name: is_portfolio_entrant
    data_type: Nullable(Bool)
    description: Projection explicite de int_mrr_movements.is_portfolio_entrant ; Actifaprès/inactifavant,retours
      inclus.
  - name: is_departure
    data_type: Nullable(Bool)
    description: Projection explicite de int_mrr_movements.is_departure ; Actifavant/inactifaprès.
  - name: is_contraction
    data_type: Nullable(Bool)
    description: Projection explicite de int_mrr_movements.is_contraction ; Actifdeux clôtures et baissenette.
  - name: is_active_before
    data_type: Nullable(Bool)
    description: Projection explicite de int_mrr_movements.is_active_before ; Activitéavant.
  - name: is_active_after
    data_type: Nullable(Bool)
    description: Projection explicite de int_mrr_movements.is_active_after ; Activitéaprès.
  - name: first_acquisition_status
    data_type: String
    description: Projection explicite de int_mrr_movements.first_acquisition_status ; Statut contexte,non déduit
      entrant seul.
  - name: is_comparable
    data_type: Nullable(Bool)
    description: Projection explicite de int_mrr_movements.is_comparable ; Deux clôtures/périmètre/devise compatibles.
  - name: commercial_link_status
    data_type: String
    description: Projection explicite de int_mrr_movements.commercial_link_status ; not_required_for_financial_classification
      / proven / missing.
  - name: source_lineage_status
    data_type: String
    description: Projection explicite de int_mrr_movements.source_lineage_status ; Clôtures et lignages expliquent
      montant sans le répéter par ligne.
  - name: calculation_status
    data_type: String
    description: Projection explicite de int_mrr_movements.calculation_status ; ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Projection explicite de int_mrr_movements.status_reason ; Cause précise stable ; NULL si aucune
      dépendance manquante.
  - name: month_date_key
    data_type: UInt32
    description: YYYYMMDD du premierjour du mois.
  - name: closing_date_key
    data_type: UInt32
    description: YYYYMMDD de month_end_date.
  - name: previous_closing_date_key
    data_type: UInt32
    description: YYYYMMDD de previous_month_end_date.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id001
