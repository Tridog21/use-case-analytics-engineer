version: 2
models:
- name: int_signature_probabilities
  description: '**Grain métier :** Étape × segment × source de coefficient × version observée. **Grain physique
    :** (model_run_id,record_key) ; record_key=probability_version_key. Rafraîchissement manuel à la demande. Histoire
    et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - pipeline
  columns:
  - name: model_run_id
    data_type: String
    description: 'Empreinte SHA256 commune de la recomposition : manifeste des entrées figées, code, référentiels
      et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Identité String H(tuple du grain décrit, domaine/version explicite), sans model_run_id ; égale
      la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date), jamais date_key
      UInt32 brut.
  - name: record_version_key
    data_type: String
    description: H(model_run_id,record_key) ; unicité physique de la révision du modèle.
  - name: row_hash
    data_type: String
    description: H(tuple ordonné de toutes les colonnes métier de la fiche, NULL et types préservés) ; exclut les
      métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Instant de calcul du lot ; fixe pour un même model_run_id, jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Empreinte immuable du code et des règles appliquées ; dérivée du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Date limite de connaissance de la recomposition ; les entrées exactes sont figées par le manifeste,
      pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Maximum de publication CDC des versions contribuant à la ligne ; NULL pour un référentiel exclusivement
      généré. Les entrées de règles non fournies proviennent du futur dbt/config/case_rules.yml fusionné dans vars,
      sans seed ou source implicite. Ce maximum ne remplace aucune date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Clés des versions sources contributrices, triées et sans répétition ; union des lignages amont.
      Liste vide pour une ligne exclusivement générée.
  - name: probability_version_key
    data_type: String
    description: H(tenant_id,source_kind,stage_id,sales_segment,valid_from_at,source_version_key).
  - name: tenant_id
    data_type: String
    description: Var source_tenant_id=demo_crm appliquée à ref pour ce jeu ; pas colonne source ajoutée au staging.
  - name: stage_id
    data_type: Int64
    description: src_state_id.
  - name: sales_segment
    data_type: String
    description: src_segment SMB/LA/ES.
  - name: probability
    data_type: Nullable(Decimal(18,8))
    description: src_probability converti décimal ; domaine [0,1].
  - name: source_kind
    data_type: String
    description: stage_probability_reference.
  - name: valid_from_at
    data_type: DateTime64(3,'UTC')
    description: Instant de capture ref, pas date d’effet passée.
  - name: valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Capture suivante exclue.
  - name: business_valid_from_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Début de fenêtre de recalcul D21 (case_history_start_at), jamais présenté comme date d’effet source
      prouvée ; NULL pour anciennes captures non appliquées.
  - name: business_valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Borne exclusive de recalcul case_as_of_boundary_at ; NULL pour anciennes captures non appliquées.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: NULL signifie barème partagé explicitement entre types4/7 D21, pas portée indéfinie ; les autres
      types sont exclus de son application.
  - name: applicability_status
    data_type: String
    description: applicable_recomputed_case pour le dernier barème capturé autorisé ; historical_capture_only pour
      les anciennes captures ; invalid si coefficient hors domaine.
  - name: calculation_status
    data_type: String
    description: ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Cause précise stable ; NULL si aucune dépendance manquante.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id001
- name: int_opportunity_stage_visits
