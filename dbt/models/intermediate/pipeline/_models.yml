    data_type: String
    description: H(tenant_id,opportunity_id), identité stable intermodèles.
  - name: visit_key
    data_type: String
    description: H(opportunity_key,first_observed_at,first_source_version_key).
  - name: stage_id
    data_type: Nullable(Int64)
    description: src_state_id du groupe consécutif.
  - name: visit_rank
    data_type: UInt32
    description: Rang chronologique, jamais ordre des codes.
  - name: first_observed_at
    data_type: DateTime64(3,'UTC')
    description: Première publication prouvant présence dans cet état.
  - name: last_observed_at
    data_type: DateTime64(3,'UTC')
    description: Dernière publication du même passage.
  - name: entered_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Entrée datée ou proxy CDC d’une transition observée ; NULL premier état avancé censuré.
  - name: exited_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Transition suivante observée ; NULL en cours/suppression sans sortie métier.
  - name: observation_ended_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Fin technique d’observation, distincte de exited_at.
  - name: previous_stage_id
    data_type: Nullable(Int64)
    description: État précédent observé hors lacune.
  - name: next_stage_id
    data_type: Nullable(Int64)
    description: État suivant observé hors lacune.
  - name: first_source_version_key
    data_type: String
    description: Version source initiale du groupe.
  - name: last_source_version_key
    data_type: String
    description: Version source finale du groupe.
  - name: event_time_basis
    data_type: String
    description: cdc_transition_proxy / business_proven / left_censored / observation_only.
  - name: is_left_censored
    data_type: Bool
    description: Début du passage non observable.
  - name: is_right_censored
    data_type: Bool
    description: Sortie admissible non observée.
  - name: is_open_visit
    data_type: Bool
    description: Pas de transition/suppression suivante ; différent d’étape commercialement ouverte.
  - name: has_observation_gap
    data_type: Bool
    description: Lacune ou suppression/réapparition séparant passages.
  - name: completed_duration_seconds
    data_type: Nullable(Float64)
    description: Différence millisecondes UTC/1000 pour passage terminé avec début admissible ; NULL sinon.
  - name: completed_duration_days
    data_type: Nullable(Float64)
    description: completed_duration_seconds/86400.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Couverture déclarée ; première observation seule ne prouve pas exhaustivité.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Fin déclarée ; jamais max(updateDate) futur.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Couverture de fenêtre vérifiée/configurée ; NULL si non établie.
  - name: calculation_status
    data_type: String
    description: ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Cause précise stable ; NULL si aucune dépendance manquante.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id002
- name: int_opportunity_periods
