- name: int_visit_responsibility
  description: '**Grain métier :** Passage × intersection d’un contexte responsable/équipe. **Grain physique :**
    (model_run_id,record_key) ; record_key=responsibility_slice_key. Rafraîchissement manuel à la demande. Histoire
    et révisions conservées ; publication contrôlée.'
  config:
    tags: &id008
    - pipeline
  columns:
  - name: model_run_id
    data_type: String
    description: 'Empreinte SHA256 commune de la recomposition : manifeste des entrées figées, code, référentiels
      et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Identité String H(tuple du grain décrit, domaine/version explicite), sans model_run_id ; égale
      la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date), jamais date_key
      UInt32 brut.
  - name: record_version_key
    data_type: String
    description: H(model_run_id,record_key) ; unicité physique de la révision du modèle.
  - name: row_hash
    data_type: String
    description: H(tuple ordonné de toutes les colonnes métier de la fiche, NULL et types préservés) ; exclut les
      métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Instant de calcul du lot ; fixe pour un même model_run_id, jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Empreinte immuable du code et des règles appliquées ; dérivée du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Date limite de connaissance de la recomposition ; les entrées exactes sont figées par le manifeste,
      pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Maximum de publication CDC des versions contribuant à la ligne ; NULL pour un référentiel exclusivement
      généré. Les entrées de règles non fournies proviennent du futur dbt/config/case_rules.yml fusionné dans vars,
      sans seed ou source implicite. Ce maximum ne remplace aucune date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Clés des versions sources contributrices, triées et sans répétition ; union des lignages amont.
      Liste vide pour une ligne exclusivement générée.
  - name: responsibility_slice_key
    data_type: String
    description: H(visit_key,valid_from_at,valid_to_at,employee_key,team_key).
  - name: tenant_id
    data_type: String
    description: Tenant passage.
  - name: opportunity_key
    data_type: String
    description: Besoin.
  - name: visit_key
    data_type: String
    description: Passage.
  - name: employee_key
    data_type: Nullable(String)
    description: Responsable observé.
  - name: employee_version_key
    data_type: Nullable(String)
    description: Version employé sur toute tranche.
  - name: team_key
    data_type: Nullable(String)
    description: Équipe résolue si disponible.
  - name: team_version_key
    data_type: Nullable(String)
    description: Version équipe.
  - name: valid_from_at
    data_type: DateTime64(3,'UTC')
    description: Maximum débuts observés passage/contexte.
  - name: valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Minimum fins observées ; NULL encore en cours.
  - name: observed_slice_duration_seconds
    data_type: Nullable(Float64)
    description: Écart bornes d’observation fermées ; pas durée exacte d’un début censuré.
  - name: allocated_duration_seconds
    data_type: Nullable(Float64)
    description: NULL avant règle individuelle/équipe.
  - name: allocation_status
    data_type: String
    description: not_decided / observed_context_only.
  - name: is_team_filter_available
    data_type: Bool
    description: true si équipe unique à entrée résolue selon D25 ; false si entrée/équipe inconnue. Ne pas utiliser
      cette tranche pour dupliquer une durée entière.
  - name: calculation_status
    data_type: String
    description: ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Cause précise stable ; NULL si aucune dépendance manquante.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id008
