  - name: target_stage_version_key
    data_type: Nullable(String)
    description: Version cible pertinente.
  - name: horizon_days
    data_type: Nullable(UInt16)
    description: 30/60/90 cohorte ; transition configurée ; NULL funnel à date.
  - name: horizon_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: addDays(anchor converti Paris,H) puis UTC ; même heure locale.
  - name: observation_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: horizon_at cohorte/transition ; cutoff funnel à date.
  - name: cohort_mature_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: max(horizon_at) sur tous membres connus tenant/mois/type/définition/horizon AVANT équipe/canal.
  - name: is_mature
    data_type: Nullable(Bool)
    description: Horizon individuel atteint.
  - name: is_cohort_mature
    data_type: Nullable(Bool)
    description: Cutoff>=cohort_mature_at et ancrages connus.
