    data_type: String
    description: Passage courant.
  - name: valid_from_at
    data_type: DateTime64(3,'UTC')
    description: Borne CDC/contexte incluse.
  - name: valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Borne suivante exclue.
  - name: is_source_deleted
    data_type: Bool
    description: src_is_deleted, sélection des versions avant exclusion.
  - name: created_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: src_created_at ; pas antidatation de l’état.
  - name: cohort_month
    data_type: Nullable(Date)
    description: Mois de création Paris.
  - name: stage_id
    data_type: Nullable(Int64)
    description: État source.
  - name: stage_key
    data_type: Nullable(String)
    description: Identité étape.
  - name: stage_version_key
    data_type: Nullable(String)
    description: Version dim_stage valable sur toute tranche.
  - name: outcome_category
    data_type: Nullable(String)
    description: Classe analytique, NULL si code non mappé.
  - name: is_open
    data_type: Nullable(Bool)
    description: Classe open ; suppression et inconnu distincts.
  - name: company_id
    data_type: Nullable(Int64)
    description: Société Boond au moment de référence.
  - name: company_key
    data_type: Nullable(String)
    description: H(tenant_id,company_id) si société connue.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version dim_company à la date de référence ; jointure sur même run.
  - name: sale_type_id
    data_type: Nullable(Int64)
    description: Type commercial de la version du besoin.
  - name: sale_type_key
    data_type: Nullable(String)
    description: Identité stable du code type.
  - name: sale_type_version_key
    data_type: Nullable(String)
    description: Version dim_sale_type au moment de référence.
  - name: employee_id
    data_type: Nullable(Int64)
    description: Responsable principal Boond à la date pertinente.
  - name: employee_key
    data_type: Nullable(String)
    description: Identité stable du responsable.
  - name: employee_version_key
    data_type: Nullable(String)
    description: Version de dim_employee à la date pertinente.
  - name: team_id
    data_type: Nullable(Int64)
    description: Équipe businessunit seulement si attribution univoque.
  - name: team_key
    data_type: Nullable(String)
    description: Identité stable d’équipe ; NULL si ambiguë ou inconnue.
  - name: team_version_key
    data_type: Nullable(String)
    description: Version dim_team pertinente à la date.
  - name: sales_segment
    data_type: Nullable(String)
    description: SMB / LA / ES si mapping fourni ; NULL sinon.
  - name: is_team_calculable
    data_type: Bool
    description: Vrai si une seule équipe est historiquement résolue ; KAM reste connue même sans segment de cible
      D23.
  - name: acquisition_channel_key
    data_type: Nullable(String)
    description: Canal officiel fixé à création ; NULL avant règle QM-02.
  - name: channel_version_key
    data_type: Nullable(String)
    description: Version de dim_channel applicable à l’acquisition.
  - name: channel_candidate_code
    data_type: Nullable(String)
    description: Code origine Boond à création, converti String ; candidat descriptif seulement.
  - name: is_channel_calculable
    data_type: Bool
    description: Vrai seulement si règle canal et mapping appliqués sans ambiguïté.
  - name: attribution_status
    data_type: String
    description: resolved / missing_team_mapping / multiple_teams / missing_channel_rule ; détails conservés.
  - name: pipeline_amount
    data_type: Nullable(Decimal(38,4))
    description: src_estimated_amount_excluding_tax converti chaîne→Decimal(38,4), sans mensualisation.
  - name: amount_basis
    data_type: String
    description: crm_estimated_unconfirmed tant que nature inconnue.
  - name: currency_code
    data_type: Nullable(String)
    description: EUR par hypothèse explicite du case D20 ; cette devise ne prouve ni mensualité ni engagement du
      montant commercial.
  - name: source_weighting_percent
    data_type: Nullable(Int64)
    description: src_weighting_percent descriptif.
  - name: source_weighted_amount
    data_type: Nullable(Decimal(38,4))
    description: src_weighted_amount_excluding_tax descriptif.
  - name: signature_probability
    data_type: Nullable(Decimal(18,8))
    description: Coefficient de ref.stage_probabilities choisi selon D21 ; NULL seulement si état/segment non couvert,
      pas de fallback Boond.
  - name: probability_version_key
    data_type: Nullable(String)
    description: Version ref si utilisée.
  - name: weighted_pipeline_amount
    data_type: Nullable(Decimal(38,4))
    description: 'Produit intermédiaire Decimal(38,12) à proba Decimal(18,8), contrôle dépassement et égalité exacte
      au cast retour depuis Decimal(38,4). Aucune perte d’échelle admise : sinon résultat NULL, insufficient_decimal_scale
      et publication de cette mesure bloquée jusqu’à migration de précision. Aucun arrondi intermédiaire ni double
      pondération.'
  - name: expected_close_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: src_closing_at saisi, pas signature réelle.
  - name: stage_entered_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: entered_at passage, NULL si censuré.
  - name: stage_first_observed_at
    data_type: DateTime64(3,'UTC')
    description: Présence observée dans passage.
  - name: stagnation_threshold_days
    data_type: Nullable(Float64)
    description: 21jours continus par défaut, dépassement strict>, paramétrable par étape/type D26 ; NULL uniquement
      si alerte explicitement désactivée.
  - name: stagnant_from_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Début passage + seuil en jours continus si connus.
  - name: is_pipeline_eligible
    data_type: Nullable(Bool)
    description: true pour type4/7 et état ouvert D22/D30 ; false si explicitement hors population ; NULL si type/état
      source inconnu.
  - name: source_opportunity_version_key
    data_type: String
    description: Version source portant attributs.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Début déclaré.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Fin déclarée.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Complétude déclarée de la fenêtre.
  - name: calculation_status
    data_type: String
    description: ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Cause précise stable ; NULL si aucune dépendance manquante.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id003
