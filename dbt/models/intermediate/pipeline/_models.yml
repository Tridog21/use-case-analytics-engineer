  - name: abandoned_contribution
    data_type: Nullable(UInt8)
    description: 1 abandoned, distinct lost ; NULL immature.
  - name: unqualified_contribution
    data_type: Nullable(UInt8)
    description: 1 unqualified, distinct lost ; NULL immature.
  - name: unknown_contribution
    data_type: Nullable(UInt8)
    description: 1 état/classe non observable mature ; inconnu conservé au dénominateur.
  - name: company_id
    data_type: Nullable(Int64)
    description: Société Boond au moment de référence.
  - name: company_key
    data_type: Nullable(String)
    description: H(tenant_id,company_id) si société connue.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version dim_company à la date de référence ; jointure sur même run.
  - name: sale_type_id
    data_type: Nullable(Int64)
