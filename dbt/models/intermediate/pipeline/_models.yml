    **Grain physique :** (model_run_id,record_key) ; record_key=period_key. Rafraîchissement manuel à la demande.
    Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id003
    - pipeline
  columns:
  - name: model_run_id
    data_type: String
    description: 'Empreinte SHA256 commune de la recomposition : manifeste des entrées figées, code, référentiels
