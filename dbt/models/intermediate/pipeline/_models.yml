    data_type: String
    description: Identité du tenant src_tenant_id.
  - name: opportunity_id
    data_type: Int64
    description: src_id du besoin Boond.
  - name: opportunity_key
    data_type: String
    description: H(tenant_id,opportunity_id), identité stable intermodèles.
  - name: followup_key
    data_type: String
    description: H(opportunity_key,followup_definition_version_key,anchor_key,observation_at).
  - name: followup_definition_id
    data_type: String
    description: ID stable de définition.
  - name: followup_definition_key
    data_type: String
    description: Identité stable H(followup_definition_id).
  - name: followup_definition_version_key
    data_type: String
    description: Version exacte de définition.
  - name: followup_kind
    data_type: String
    description: cohort_outcome / funnel_reach / stage_transition.
  - name: funnel_position
    data_type: Nullable(UInt16)
    description: Position configurée, pas code numérique.
  - name: previous_target_stage_id
    data_type: Nullable(Int64)
    description: Cible précédente configurée.
  - name: created_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Création Boond.
  - name: cohort_month
    data_type: Nullable(Date)
    description: Mois Paris de création, inchangé par réouverture.
  - name: anchor_key
    data_type: String
    description: Création ou passage admissible.
  - name: anchor_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Création pour cohorte/funnel ; entrée en A pour transition.
  - name: source_stage_id
    data_type: Nullable(Int64)
    description: Source transition, NULL cohorte.
  - name: target_stage_id
