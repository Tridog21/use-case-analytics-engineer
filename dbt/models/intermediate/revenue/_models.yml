- name: int_mrr_movements
  description: '**Grain métier :** Société × mois × composante nette ; stable/inconnu conservés pour comptages clients.
    **Grain physique :** (model_run_id,record_key) ; record_key=movement_contribution_key. Rafraîchissement manuel
    à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id005
    - revenue
  columns:
  - name: model_run_id
    data_type: String
    description: 'Empreinte SHA256 commune de la recomposition : manifeste des entrées figées, code, référentiels
      et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Identité String H(tuple du grain décrit, domaine/version explicite), sans model_run_id ; égale
      la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date), jamais date_key
      UInt32 brut.
  - name: record_version_key
    data_type: String
    description: H(model_run_id,record_key) ; unicité physique de la révision du modèle.
  - name: row_hash
    data_type: String
    description: H(tuple ordonné de toutes les colonnes métier de la fiche, NULL et types préservés) ; exclut les
      métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Instant de calcul du lot ; fixe pour un même model_run_id, jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Empreinte immuable du code et des règles appliquées ; dérivée du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Date limite de connaissance de la recomposition ; les entrées exactes sont figées par le manifeste,
      pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Maximum de publication CDC des versions contribuant à la ligne ; NULL pour un référentiel exclusivement
      généré. Les entrées de règles non fournies proviennent du futur dbt/config/case_rules.yml fusionné dans vars,
      sans seed ou source implicite. Ce maximum ne remplace aucune date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Clés des versions sources contributrices, triées et sans répétition ; union des lignages amont.
      Liste vide pour une ligne exclusivement générée.
  - name: movement_contribution_key
    data_type: String
    description: H(company_key,month_date,movement_kind).
  - name: tenant_id
    data_type: String
    description: Tenant.
  - name: client_context_key
    data_type: String
    description: Contexte société/mois.
  - name: company_id
    data_type: Int64
    description: ID société.
  - name: company_key
    data_type: String
    description: Identité société.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version à clôture.
  - name: month_date
    data_type: Date
    description: Mois.
  - name: month_end_date
    data_type: Date
    description: Clôture courante.
  - name: previous_month_end_date
    data_type: Date
    description: Clôture précédente.
  - name: movement_kind
    data_type: String
    description: new / upsell / departure / contraction / stable / unknown.
  - name: new_mrr_component
    data_type: Nullable(String)
    description: New entrants/retours ;Upsell hausse restants ;NULL autres.
  - name: sum_new_mrr
    data_type: Nullable(Decimal(38,4))
    description: MRR après entrant ;max(après−avant,0) hausse restant ;NULL noncomparable. Aucune ligne total en
      plus.
  - name: sum_departure_mrr
    data_type: Nullable(Decimal(38,4))
    description: MRR avant sortant ;0 autres cas comparables.
  - name: sum_contraction_mrr
    data_type: Nullable(Decimal(38,4))
    description: max(avant−après,0) restant baisse ;0 autres cas comparables.
  - name: sum_candidate_new_mrr
    data_type: Nullable(Decimal(38,4))
    description: Mêmeformule sur candidats,diagnostic devise inconnue.
  - name: sum_candidate_departure_mrr
    data_type: Nullable(Decimal(38,4))
    description: Départs candidats.
  - name: sum_candidate_contraction_mrr
    data_type: Nullable(Decimal(38,4))
    description: Baisses candidates.
  - name: is_portfolio_entrant
    data_type: Nullable(Bool)
    description: Actifaprès/inactifavant,retours inclus.
  - name: is_departure
    data_type: Nullable(Bool)
    description: Actifavant/inactifaprès.
  - name: is_contraction
    data_type: Nullable(Bool)
    description: Actifdeux clôtures et baissenette.
  - name: is_active_before
    data_type: Nullable(Bool)
    description: Activitéavant.
  - name: is_active_after
    data_type: Nullable(Bool)
    description: Activitéaprès.
  - name: first_acquisition_status
    data_type: String
    description: Statut contexte,non déduit entrant seul.
  - name: is_comparable
    data_type: Nullable(Bool)
    description: Deux clôtures/périmètre/devise compatibles.
  - name: commercial_link_status
    data_type: String
    description: not_required_for_financial_classification / proven / missing.
  - name: source_lineage_status
    data_type: String
    description: Clôtures et lignages expliquent montant sans le répéter par ligne.
  - name: calculation_status
    data_type: String
    description: ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Cause précise stable ; NULL si aucune dépendance manquante.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id005
