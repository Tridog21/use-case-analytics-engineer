version: 2
models:
- name: int_subscription_periods
  description: '**Grain métier :** Ligne d’abonnement × intervalle d’attributs et rattachement projet observés.
    **Grain physique :** (model_run_id,record_key) ; record_key=subscription_period_key. Rafraîchissement manuel
    à la demande. Histoire et révisions conservées ; publication contrôlée.'
  config:
    tags: &id001
    - revenue
  columns:
  - name: model_run_id
    data_type: String
    description: 'Empreinte SHA256 commune de la recomposition : manifeste des entrées figées, code, référentiels
      et paramètres ; fournie par orchestration, identique dans tout le DAG.'
  - name: record_key
    data_type: String
    description: Identité String H(tuple du grain décrit, domaine/version explicite), sans model_run_id ; égale
      la clé de grain lorsque cette dernière est déjà hashée. dim_date utilise H(calendar_date), jamais date_key
      UInt32 brut.
  - name: record_version_key
    data_type: String
    description: H(model_run_id,record_key) ; unicité physique de la révision du modèle.
  - name: row_hash
    data_type: String
    description: H(tuple ordonné de toutes les colonnes métier de la fiche, NULL et types préservés) ; exclut les
      métadonnées de calcul.
  - name: calculated_at
    data_type: DateTime64(3,'UTC')
    description: Instant de calcul du lot ; fixe pour un même model_run_id, jamais utilisé comme événement métier.
  - name: rule_version
    data_type: String
    description: Empreinte immuable du code et des règles appliquées ; dérivée du manifeste du lot.
  - name: input_cutoff_at
    data_type: DateTime64(3,'UTC')
    description: Date limite de connaissance de la recomposition ; les entrées exactes sont figées par le manifeste,
      pas par ce timestamp seul.
  - name: source_published_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Maximum de publication CDC des versions contribuant à la ligne ; NULL pour un référentiel exclusivement
      généré. Les entrées de règles non fournies proviennent du futur dbt/config/case_rules.yml fusionné dans vars,
      sans seed ou source implicite. Ce maximum ne remplace aucune date métier.
  - name: source_version_keys
    data_type: Array(String)
    description: Clés des versions sources contributrices, triées et sans répétition ; union des lignages amont.
      Liste vide pour une ligne exclusivement générée.
  - name: subscription_period_key
    data_type: String
    description: H(subscription_key,valid_from_at).
  - name: tenant_id
    data_type: String
    description: Tenant ligne/projet.
  - name: line_id
    data_type: Int64
    description: src_id deliveries.
  - name: line_created_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: src_created_at de la livraison ; conserver les valeurs source, pas premier meta.ts.
  - name: is_creation_date_reliable
    data_type: Bool
    description: true seulement si création nonNULL constante entre versions, aucun CDC antérieur à cette création
      et aucun début de service antérieur contradictoire ; false sinon, pas de correction de la source.
  - name: subscription_key
    data_type: String
    description: H(tenant_id,line_id) ; pas continuité inventée entre lignes.
  - name: project_id
    data_type: Nullable(Int64)
    description: src_project_id.
  - name: project_key
    data_type: Nullable(String)
    description: H(tenant_id,project_id).
  - name: company_id
    data_type: Nullable(Int64)
    description: src_company_id du projet à date.
  - name: company_key
    data_type: Nullable(String)
    description: Identité société.
  - name: company_version_key
    data_type: Nullable(String)
    description: Version société sur tranche.
  - name: opportunity_id
    data_type: Nullable(Int64)
    description: src_opportunity_id projet, lien direct descriptif.
  - name: valid_from_at
    data_type: DateTime64(3,'UTC')
    description: Début d’observation/contexte inclus.
  - name: valid_to_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Fin exclue.
  - name: is_source_deleted
    data_type: Bool
    description: Suppression ligne conservée.
  - name: is_project_deleted
    data_type: Nullable(Bool)
    description: Suppression technique projet, pas résiliation.
  - name: service_started_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: src_started_at ligne.
  - name: service_ended_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: src_ended_at ligne ; jour local de fin inclus.
  - name: service_start_date
    data_type: Nullable(Date)
    description: Date Paris début.
  - name: service_end_exclusive_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Minuit Paris lendemain du jour de fin converti UTC ; NULL fin absente.
  - name: line_state_id
    data_type: Nullable(Int64)
    description: src_state_id ;1=En cours selon règle choisie.
  - name: project_type_id
    data_type: Nullable(Int64)
    description: src_type_id projet descriptif ; activité selon état/période D12, sans filtre project_type=4 ni
      exclusion d’expansion.
  - name: project_started_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Début projet séparé.
  - name: project_ended_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Fin projet séparée.
  - name: quantity
    data_type: Nullable(Decimal(38,4))
    description: JSON subscriptionQuantityCharged valide, NULL sinon.
  - name: unit_monthly_price
    data_type: Nullable(Decimal(38,4))
    description: JSON subscriptionPriceExcludingTax valide.
  - name: line_monthly_amount
    data_type: Nullable(Decimal(38,4))
    description: 'src_average_daily_price_excluding_tax : montant mensuel TOTAL incluant quantité, converti Decimal.'
  - name: recomputed_quantity_price_amount
    data_type: Nullable(Decimal(38,4))
    description: Produit quantity×unit_monthly_price à échelle intermédiaire8, contrôle dépassement et absence de
      perte avant représentation finale ; contrôle uniquement, jamais contribution supplémentaire.
  - name: currency_code
    data_type: Nullable(String)
    description: EUR par hypothèse explicite du case D20 ; cette devise ne prouve ni mensualité ni engagement du
      montant commercial.
  - name: monetary_status
    data_type: String
    description: monthly_amount_known_currency_unknown / ready / missing_amount / invalid_amount.
  - name: continuity_key
    data_type: Nullable(String)
    description: Continuité remplacement entre lignes uniquement si prouvée, NULL actuellement.
  - name: activity_rule_status
    data_type: String
    description: line_state_1_and_service_dates ; état/dates manquants indéterminés.
  - name: source_delivery_version_key
    data_type: String
    description: Version source ligne.
  - name: source_project_version_key
    data_type: Nullable(String)
    description: Version projet au même instant.
  - name: coverage_start_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Début déclaré.
  - name: coverage_end_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Fin déclarée.
  - name: is_history_complete
    data_type: Nullable(Bool)
    description: Complétude des versions/liens déclarée.
  - name: calculation_status
    data_type: String
    description: ready / partial / blocked / not_applicable.
  - name: status_reason
    data_type: Nullable(String)
    description: Cause précise stable ; NULL si aucune dépendance manquante.
  data_tests:
  - case_grain:
      arguments:
        key: record_version_key
        run_scoped: true
      config:
        tags: *id001
