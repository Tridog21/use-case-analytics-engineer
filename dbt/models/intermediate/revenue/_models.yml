  - name: amount_before
    data_type: Nullable(Decimal(38,4))
    description: Montant mensuel avant.
  - name: amount_after
    data_type: Nullable(Decimal(38,4))
    description: Montant mensuel après.
  - name: delta_amount
    data_type: Nullable(Decimal(38,4))
    description: Après−avant si tous deux connus.
  - name: is_active_before
    data_type: Nullable(Bool)
    description: Activité avant la borne.
  - name: is_active_after
    data_type: Nullable(Bool)
    description: Activité après, indépendante montant.
  - name: change_quality
    data_type: String
    description: observed_change / scheduled_boundary / incomplete_pair / missing_continuity.
