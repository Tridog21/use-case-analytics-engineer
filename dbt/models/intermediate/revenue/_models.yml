  - name: before_period_key
    data_type: Nullable(String)
    description: Période précédente.
  - name: after_period_key
    data_type: Nullable(String)
    description: Période suivante.
  - name: observed_change_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Publication CDC ; NULL si échéance seule.
  - name: effective_at
    data_type: Nullable(DateTime64(3,'UTC'))
    description: Date d’effet métier prouvée ; NULL sinon.
  - name: trigger_kind
    data_type: String
    description: cdc_attribute_change / service_start_boundary / service_end_boundary.
  - name: trigger_origin_key
    data_type: String
